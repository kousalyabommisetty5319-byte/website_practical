<!DOCTYPE html>
<html>
<head>
    <title>Box Shadow and Text Shadow</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            padding: 40px;
            text-align: center;
        }

        h1 {
            text-shadow: 3px 3px 5px gray;
        }

        .card {
            width: 300px;
            margin: 50px auto;
            padding: 40px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 5px 5px 15px gray;
        }

        a {
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>Shadow Effects</h1>

    <div class="card">
        <h2>Box Shadow</h2>
        <p>This card uses box-shadow.</p>
    </div>

    <a href="../index/index.html">Home</a> |
    <a href="index.html">CSS Programs</a>

</body>
</html>
