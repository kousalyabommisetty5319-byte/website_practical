<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Width Height Sizing</title>

    <style>

        body {
            font-family: Arial;
            padding: 30px;
            background-color: #f8fafc;
        }

        .small {
            width: 200px;
            height: 100px;
            background-color: #bfdbfe;
            padding: 20px;
            margin: 20px;
        }

        .medium {
            width: 50%;
            min-height: 150px;
            background-color: #bbf7d0;
            padding: 20px;
            margin: 20px;
        }

        .responsive {
            width: 80%;
            max-width: 700px;
            min-height: 100px;
            background-color: #fde68a;
            padding: 20px;
            margin: 20px;
        }

    </style>

</head>

<body>

    <h1>Width, Height and Sizing</h1>

    <div class="small">
        Fixed width: 200px
    </div>

    <div class="medium">
        Width: 50%
    </div>

    <div class="responsive">
        Responsive width with max-width.
    </div>

    <a href="../index/index.html">Home</a> |
    <a href="index.html">CSS Programs</a>

</body>
</html>
