<!DOCTYPE html>
<html>
<head>
    <title>Z-Index and Stacking</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 30px;
        }

        .container {
            position: relative;
            width: 500px;
            height: 350px;
            margin: 40px auto;
            border: 2px solid #333;
        }

        .box1 {
            position: absolute;
            width: 200px;
            height: 200px;
            background-color: #777;
            top: 50px;
            left: 80px;
            z-index: 1;
            padding: 20px;
        }

        .box2 {
            position: absolute;
            width: 200px;
            height: 200px;
            background-color: #333;
            color: white;
            top: 100px;
            left: 180px;
            z-index: 2;
            padding: 20px;
        }

        a {
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>Z-Index Example</h1>

    <div class="container">

        <div class="box1">
            Box 1<br>
            z-index: 1
        </div>

        <div class="box2">
            Box 2<br>
            z-index: 2
        </div>

    </div>

    <a href="../index/index.html">Home</a> |
    <a href="index.html">CSS Programs</a>

</body>
</html>
