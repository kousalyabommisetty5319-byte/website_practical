<!DOCTYPE html>
<html>
<head>
    <title>CSS Lists and Tables</title>

    <style>
        body {
            font-family: Arial;
            padding: 30px;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        ul {
            background-color: white;
            padding: 20px 40px;
            list-style-type: square;
        }

        ol {
            background-color: white;
            padding: 20px 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #333;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #333;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #eeeeee;
        }

        tr:hover {
            background-color: #ddd;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>CSS Lists and Tables</h1>

    <h2>Unordered List</h2>

    <ul>
        <li>Python</li>
        <li>C Programming</li>
        <li>HTML</li>
        <li>CSS</li>
    </ul>

    <h2>Ordered List</h2>

    <ol>
        <li>Learn HTML</li>
        <li>Learn CSS</li>
        <li>Learn JavaScript</li>
        <li>Build Projects</li>
    </ol>

    <h2>Student Table</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Course</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td>Kousalya</td>
            <td>CSE</td>
            <td>95</td>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>CSE</td>
            <td>88</td>
        </tr>

        <tr>
            <td>Priya</td>
            <td>AIML</td>
            <td>91</td>
        </tr>
    </table>

    <a href="../index/index.html">Home</a> |
    <a href="index.html">CSS Programs</a>

</div>

</body>
</html>
