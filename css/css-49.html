<!DOCTYPE html>
<html>
<head>
    <title>Sticky Header</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            position: sticky;
            top: 0;
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }

        .content {
            padding: 30px;
            line-height: 2;
        }

        .box {
            height: 300px;
            margin: 20px 0;
            padding: 30px;
            background-color: #eee;
        }

        .links {
            text-align: center;
            padding: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Sticky Header</h1>
        <p>Scroll down</p>
    </header>

    <div class="content">

        <div class="box">
            <h2>Section 1</h2>
            <p>This is the first section.</p>
        </div>

        <div class="box">
            <h2>Section 2</h2>
            <p>This is the second section.</p>
        </div>

        <div class="box">
            <h2>Section 3</h2>
            <p>This is the third section.</p>
        </div>

        <div class="box">
            <h2>Section 4</h2>
            <p>This is the fourth section.</p>
        </div>

    </div>

    <div class="links">
        <a href="../index/index.html">Home</a> |
        <a href="index.html">CSS Programs</a>
    </div>

</body>
</html>
