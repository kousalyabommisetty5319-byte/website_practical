<!DOCTYPE html>
<html>
<head>
    <title>CSS 70 - Dark Mode</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --background: white;
            --text: #222;
            --card: #eeeeee;
            --button: #222;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .theme {
            display: none;
        }

        .page {
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            padding: 40px;
            text-align: center;
            transition: 0.3s;
        }

        .theme:checked ~ .page {
            --background: #222;
            --text: white;
            --card: #444;
            --button: white;
        }

        .toggle {
            display: inline-block;
            padding: 12px 20px;
            background: var(--button);
            color: var(--background);
            border-radius: 5px;
            cursor: pointer;
        }

        .card {
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            background: var(--card);
            border-radius: 10px;
        }

        .back {
            display: block;
            margin-top: 30px;
            color: var(--text);
        }
    </style>
</head>

<body>

<input type="checkbox" id="theme" class="theme">

<div class="page">

    <h1>Dark Mode</h1>

    <p>Click the button to switch between light and dark mode.</p>

    <label for="theme" class="toggle">
        Toggle Dark Mode
    </label>

    <div class="card">
        <h2>CSS Variables</h2>
        <p>
            This page uses CSS custom properties
            to change the colors.
        </p>
    </div>

    <a class="back" href="index.html">
        ← Back to CSS Programs
    </a>
    <a href="../index/index.html">🏠 Home</a>

</div>

</body>
</html>
