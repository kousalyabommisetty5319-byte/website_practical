<!DOCTYPE html>
<html>
<head>
    <title>CSS Variables</title>

    <style>
        :root {
            --main-color: #333;
            --secondary-color: #eee;
            --text-color: white;
            --padding: 20px;
        }

        body {
            font-family: Arial;
            margin: 0;
            background-color: var(--secondary-color);
        }

        header {
            background-color: var(--main-color);
            color: var(--text-color);
            padding: var(--padding);
            text-align: center;
        }

        .card {
            max-width: 500px;
            margin: 50px auto;
            padding: var(--padding);
            background-color: white;
            border: 3px solid var(--main-color);
            text-align: center;
        }

        button {
            background-color: var(--main-color);
            color: var(--text-color);
            padding: 12px 20px;
            border: none;
        }

        .links {
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <h1>CSS Variables</h1>
</header>

<div class="card">

    <h2>Reusable CSS Values</h2>

    <p>
        CSS variables allow us to store values and reuse them.
    </p>

    <button>Click Me</button>

</div>

<div class="links">
    <a href="../index/index.html">Home</a> |
    <a href="index.html">CSS Programs</a>
</div>

</body>
</html>
