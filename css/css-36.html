<!DOCTYPE html>
<html>
<head>
    <title>CSS Display Property</title>

    <style>
        body {
            font-family: Arial;
            padding: 30px;
        }

        .block {
            display: block;
            background-color: #ddd;
            padding: 15px;
            margin: 10px;
        }

        .inline {
            display: inline;
            background-color: #bbb;
            padding: 10px;
        }

        .inline-block {
            display: inline-block;
            background-color: #999;
            padding: 20px;
            margin: 10px;
        }

        .none {
            display: none;
        }

        .example {
            padding: 20px;
            border: 2px solid #333;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Display Property</h1>

    <div class="example">

        <h2>Block</h2>

        <div class="block">
            Block Element
        </div>

        <h2>Inline</h2>

        <span class="inline">Inline 1</span>
        <span class="inline">Inline 2</span>

        <h2>Inline-Block</h2>

        <div class="inline-block">Box 1</div>
        <div class="inline-block">Box 2</div>

        <h2>None</h2>

        <p class="none">
            This content is hidden using display: none.
        </p>

    </div>

    <a href="../index/index.html">Home</a> |
    <a href="index.html">CSS Programs</a>

</body>
</html>
