<!DOCTYPE html>
<html>
<head>
    <title>CSS Button Hover Animation</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 60px;
            background-color: #f4f4f4;
        }

        .btn {
            padding: 15px 35px;
            font-size: 18px;
            color: white;
            background-color: #333;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.4s;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px #999;
            letter-spacing: 2px;
        }

        a {
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>CSS Button Hover Animation</h1>

    <button class="btn">Hover Me</button>

    <br><br>

    <a href="../index/index.html">Home</a> |
    <a href="index.html">CSS Programs</a>

</body>
</html>
