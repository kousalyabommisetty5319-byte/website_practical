<!DOCTYPE html>
<html>
<head>
    <title>CSS 61 - Flexbox Alignment and Order</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f2f2;
        }

        h1 {
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 20px;
            height: 300px;
            padding: 20px;
            background: #ddd;
        }

        .box {
            width: 120px;
            padding: 40px 10px;
            text-align: center;
            background: white;
            border: 2px solid black;
        }

        .box1 {
            order: 3;
        }

        .box2 {
            order: 1;
        }

        .box3 {
            order: 2;
        }

        .back {
            display: block;
            text-align: center;
            margin: 25px;
        }
    </style>
</head>

<body>

<h1>Flexbox Alignment and Order</h1>

<div class="container">
    <div class="box box1">Box 1<br>Order 3</div>
    <div class="box box2">Box 2<br>Order 1</div>
    <div class="box box3">Box 3<br>Order 2</div>
</div>

<a class="back" href="index.html">← Back to CSS Programs</a>
<a href="../index/index.html">🏠 Home</a>

</body>
</html>
