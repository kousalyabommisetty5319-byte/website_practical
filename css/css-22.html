<!DOCTYPE html>
<html>
<head>
    <title>CSS Login Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #e8eef5;
        }

        .login-box {
            width: 350px;
            background-color: white;
            padding: 30px;
            margin: 100px auto;
            border-radius: 10px;
            box-shadow: 0 0 15px #aaa;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Login</h1>

    <form>

        <input type="email" placeholder="Email">

        <input type="password" placeholder="Password">

        <button type="submit">Login</button>

    </form>

    <div class="links">
        <a href="../index/index.html">Home</a> |
        <a href="index.html">CSS Programs</a>
    </div>

</div>

</body>
</html>
