<!DOCTYPE html>
<html>
<head>
    <title>Complete Homepage</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
            background-color: #eee;
        }

        .hero h1 {
            font-size: 45px;
        }

        .hero button {
            padding: 12px 25px;
            background-color: #222;
            color: white;
            border: none;
        }

        .features {
            display: flex;
            gap: 20px;
            padding: 40px;
        }

        .feature {
            flex: 1;
            padding: 30px;
            background-color: #f5f5f5;
            text-align: center;
        }

        footer {
            text-align: center;
            background-color: #222;
            color: white;
            padding: 20px;
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
            }

            .features {
                flex-direction: column;
            }
        }

        .links {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>

    <h2>My Website</h2>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

</header>

<section class="hero">

    <h1>Welcome to My Website</h1>

    <p>A simple homepage created using HTML and CSS.</p>

    <button>Get Started</button>

</section>

<section class="features">

    <div class="feature">
        <h2>HTML</h2>
        <p>Creates the structure of webpages.</p>
    </div>

    <div class="feature">
        <h2>CSS</h2>
        <p>Styles and designs webpages.</p>
    </div>

    <div class="feature">
        <h2>JavaScript</h2>
        <p>Adds interactivity to webpages.</p>
    </div>

</section>

<footer>
    <p>© 2026 My Website</p>
</footer>

<div class="links">
    <a href="../index/index.html">Home</a> |
    <a href="index.html">CSS Programs</a>
</div>

</body>
</html>
