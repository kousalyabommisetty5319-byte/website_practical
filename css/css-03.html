<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Colors Backgrounds Borders</title>

    <style>

        body {
            font-family: Arial;
            padding: 30px;
            background-color: #f1f5f9;
        }

        .color-box {
            color: white;
            background-color: #2563eb;
            padding: 25px;
            margin: 20px;
            border: 5px solid #1e3a8a;
        }

        .background-box {
            background-color: #fef3c7;
            padding: 30px;
            border: 3px dashed orange;
        }

        .border-box {
            margin-top: 20px;
            padding: 30px;
            border: 5px double purple;
        }

    </style>

</head>

<body>

    <h1>CSS Colors, Backgrounds and Borders</h1>

    <div class="color-box">
        This box demonstrates colors.
    </div>

    <div class="background-box">
        This box demonstrates background colors.
    </div>

    <div class="border-box">
        This box demonstrates different borders.
    </div>

</html>
