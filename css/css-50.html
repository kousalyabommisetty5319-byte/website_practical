<!DOCTYPE html>
<html>
<head>
    <title>Fixed Sidebar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 220px;
            height: 100%;
            background-color: #333;
            color: white;
            padding-top: 30px;
        }

        .sidebar h2 {
            text-align: center;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 25px;
        }

        .sidebar a:hover {
            background-color: #555;
        }

        .content {
            margin-left: 220px;
            padding: 40px;
        }

        .box {
            height: 300px;
            background-color: #eee;
            margin: 20px 0;
            padding: 30px;
        }

        @media (max-width: 600px) {

            .sidebar {
                width: 100px;
            }

            .sidebar a {
                padding: 12px 5px;
                text-align: center;
            }

            .content {
                margin-left: 100px;
            }
        }

        .links {
            text-align: center;
            margin: 30px;
        }
    </style>
</head>

<body>

    <div class="sidebar">

        <h2>Menu</h2>

        <a href="#">Home</a>
        <a href="#">Profile</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>

    </div>

    <div class="content">

        <h1>Fixed Sidebar</h1>

        <div class="box">
            <h2>Section 1</h2>
            <p>
                The sidebar remains fixed while the page is scrolled.
            </p>
        </div>

        <div class="box">
            <h2>Section 2</h2>
            <p>
                This demonstrates fixed positioning in CSS.
            </p>
        </div>

        <div class="box">
            <h2>Section 3</h2>
            <p>
                Scroll the page to observe the sidebar.
            </p>
        </div>

        <div class="links">
            <a href="../index/index.html">Home</a> |
            <a href="index.html">CSS Programs</a>
        </div>

    </div>

</body>
</html>
