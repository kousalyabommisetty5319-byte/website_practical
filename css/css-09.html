<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>CSS Navigation Bar</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
        }

        nav {
            background-color: #1e293b;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 15px 25px;
            display: inline-block;
        }

        nav a:hover {
            background-color: #2563eb;
        }

        .content {
            padding: 40px;
            text-align: center;
        }

    </style>

</head>

<body>

    <nav>

        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>

    </nav>

    <div class="content">

        <h1>Styled Navigation Bar</h1>

        <p>
            Move the mouse over the navigation links.
        </p>

        <br>

        <a href="../index/index.html">Home</a> |
        <a href="index.html">CSS Programs</a>

    </div>

</body>
</html>
