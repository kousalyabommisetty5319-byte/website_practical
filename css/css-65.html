<!DOCTYPE html>
<html>
<head>
    <title>CSS 65 - 2D and 3D Transforms</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 60px;
            flex-wrap: wrap;
            margin: 50px;
        }

        .box {
            width: 150px;
            height: 150px;
            background: #ddd;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid black;
            transition: transform 1s;
        }

        .rotate:hover {
            transform: rotate(45deg);
        }

        .scale:hover {
            transform: scale(1.3);
        }

        .translate:hover {
            transform: translate(30px, 20px);
        }

        .skew:hover {
            transform: skew(20deg);
        }

        .three-d {
            perspective: 500px;
        }

        .three-d:hover {
            transform: rotateY(180deg);
        }

        .back {
            display: block;
            margin: 30px;
        }
    </style>
</head>

<body>

<h1>2D and 3D CSS Transforms</h1>

<div class="container">

    <div class="box rotate">
        Rotate
    </div>

    <div class="box scale">
        Scale
    </div>

    <div class="box translate">
        Translate
    </div>

    <div class="box skew">
        Skew
    </div>

    <div class="box three-d">
        3D Rotate
    </div>

</div>

<a class="back" href="index.html">← Back to CSS Programs</a>
<a href="../index/index.html">🏠 Home</a>

</body>
</html>
