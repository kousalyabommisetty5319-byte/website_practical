<!DOCTYPE html>
<html>
<head>
    <title>Two Column Grid</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            padding: 30px;
        }

        .sidebar {
            background-color: #333;
            color: white;
            padding: 30px;
        }

        .content {
            background-color: #eee;
            padding: 30px;
        }

        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .links {
            text-align: center;
            margin: 20px;
        }
    </style>
</head>

<body>

    <h1 style="text-align:center;">Two-Column Grid</h1>

    <div class="container">

        <div class="sidebar">

            <h2>Sidebar</h2>

            <p>Home</p>
            <p>About</p>
            <p>Projects</p>
            <p>Contact</p>

        </div>

        <div class="content">

            <h2>Main Content</h2>

            <p>
                CSS Grid allows us to create two-column layouts
                easily.
            </p>

            <p>
                Resize the browser to see the responsive layout.
            </p>

        </div>

    </div>

    <div class="links">
        <a href="../index/index.html">Home</a> |
        <a href="index.html">CSS Programs</a>
    </div>

</body>
</html>
