<!DOCTYPE html>
<html>
<head>
    <title>Online Shopping Webpage</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background-color: #f5f5f5;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 40px;
        }

        .product {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px #aaa;
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .product-content {
            padding: 20px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
        }

        @media (max-width: 900px) {
            .products {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .products {
                grid-template-columns: 1fr;
                padding: 20px;
            }

            header {
                flex-direction: column;
            }
        }

        .links {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>

        <h2>ShopEasy</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Cart</a>
        </nav>

    </header>

    <div class="products">

        <div class="product">
            <img src="https://picsum.photos/300/200?21" alt="Product">
            <div class="product-content">
                <h3>Headphones</h3>
                <p class="price">₹1,999</p>
                <button>Add to Cart</button>
            </div>
        </div>

        <div class="product">
            <img src="https://picsum.photos/300/200?22" alt="Product">
            <div class="product-content">
                <h3>Smart Watch</h3>
                <p class="price">₹2,499</p>
                <button>Add to Cart</button>
            </div>
        </div>

        <div class="product">
            <img src="https://picsum.photos/300/200?23" alt="Product">
            <div class="product-content">
                <h3>Backpack</h3>
                <p class="price">₹999</p>
                <button>Add to Cart</button>
            </div>
        </div>

        <div class="product">
            <img src="https://picsum.photos/300/200?24" alt="Product">
            <div class="product-content">
                <h3>Shoes</h3>
                <p class="price">₹1,499</p>
                <button>Add to Cart</button>
            </div>
        </div>

    </div>

    <div class="links">
        <a href="../index/index.html">Home</a> |
        <a href="index.html">CSS Programs</a>
    </div>

</body>
</html>
