<!DOCTYPE html>
<html>
<head>
    <title>Responsive Image Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            padding: 30px;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }

        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }

        .links {
            text-align: center;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <h1>Responsive Image Gallery</h1>

    <div class="gallery">

        <img src="https://picsum.photos/400/300?11" alt="Image 1">
        <img src="https://picsum.photos/400/300?12" alt="Image 2">
        <img src="https://picsum.photos/400/300?13" alt="Image 3">
        <img src="https://picsum.photos/400/300?14" alt="Image 4">
        <img src="https://picsum.photos/400/300?15" alt="Image 5">
        <img src="https://picsum.photos/400/300?16" alt="Image 6">
        <img src="https://picsum.photos/400/300?17" alt="Image 7">
        <img src="https://picsum.photos/400/300?18" alt="Image 8">

    </div>

    <div class="links">
        <a href="../index/index.html">Home</a> |
        <a href="index.html">CSS Programs</a>
    </div>

</body>
</html>
