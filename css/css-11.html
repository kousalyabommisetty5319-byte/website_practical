<!DOCTYPE html>
<html>
<head>
    <title>CSS Pseudo-Elements</title>

    <style>
        body {
            font-family: Arial;
            padding: 30px;
            background-color: #f4f4f4;
        }

        .box {
            background-color: white;
            padding: 25px;
            border: 2px solid #333;
            max-width: 600px;
            margin: auto;
        }

        .box::before {
            content: "START → ";
            color: blue;
            font-weight: bold;
        }

        .box::after {
            content: " ← END";
            color: red;
            font-weight: bold;
        }

        p::first-letter {
            font-size: 40px;
            color: green;
            font-weight: bold;
        }

        p::first-line {
            font-weight: bold;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Pseudo-Elements</h1>

        <p>
            CSS pseudo-elements allow us to style a specific part of an element.
            Examples include first-letter, first-line, before and after.
        </p>
    </div>

    <a href="../index/index.html">Home</a> |
    <a href="index.html">CSS Programs</a>

</body>
</html>
