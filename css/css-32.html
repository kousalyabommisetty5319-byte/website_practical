<!DOCTYPE html>
<html>
<head>
    <title>Border Radius Shapes</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 30px;
        }

        .square {
            width: 120px;
            height: 120px;
            background-color: #333;
            margin: 20px auto;
            border-radius: 20px;
        }

        .circle {
            width: 120px;
            height: 120px;
            background-color: #666;
            margin: 20px auto;
            border-radius: 50%;
        }

        .pill {
            width: 200px;
            padding: 20px;
            background-color: #999;
            margin: 20px auto;
            border-radius: 50px;
        }

        a {
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>Border Radius</h1>

    <div class="square"></div>

    <div class="circle"></div>

    <div class="pill">
        Pill Shape
    </div>

    <a href="../index/index.html">Home</a> |
    <a href="index.html">CSS Programs</a>

</body>
</html>
