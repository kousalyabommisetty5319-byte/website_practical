<!DOCTYPE html>
<html>
<head>
    <title>Responsive College Homepage</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        .hero {
            padding: 100px 20px;
            text-align: center;
            background-color: #eee;
        }

        .hero h1 {
            font-size: 42px;
        }

        .courses {
            display: flex;
            gap: 20px;
            padding: 40px;
        }

        .course {
            flex: 1;
            padding: 30px;
            text-align: center;
            background-color: #f5f5f5;
            border-radius: 10px;
        }

        footer {
            background-color: #222;
            color: white;
            padding: 25px;
            text-align: center;
        }

        @media (max-width: 700px) {

            header {
                flex-direction: column;
            }

            .courses {
                flex-direction: column;
                padding: 20px;
            }

            .hero h1 {
                font-size: 30px;
            }
        }

        .links {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>

        <h2>ABC College</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#">Courses</a>
            <a href="#">Admissions</a>
            <a href="#">Contact</a>
        </nav>

    </header>

    <section class="hero">

        <h1>Welcome to ABC College</h1>

        <p>Learn. Grow. Achieve.</p>

    </section>

    <section class="courses">

        <div class="course">
            <h2>Computer Science</h2>
            <p>Programming and technology.</p>
        </div>

        <div class="course">
            <h2>Artificial Intelligence</h2>
            <p>AI and machine learning.</p>
        </div>

        <div class="course">
            <h2>Electronics</h2>
            <p>Electronics and communication.</p>
        </div>

    </section>

    <footer>
        <p>© 2026 ABC College</p>
    </footer>

    <div class="links">
        <a href="../index/index.html">Home</a> |
        <a href="index.html">CSS Programs</a>
    </div>

</body>
</html>
