<!DOCTYPE html>
<html>
<head>
    <title>Responsive Login Signup</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background-color: #eee;
        }

        .container {
            display: flex;
            max-width: 800px;
            margin: 80px auto;
            background-color: white;
            box-shadow: 0 0 15px #aaa;
        }

        .login,
        .signup {
            flex: 1;
            padding: 40px;
        }

        .login {
            background-color: #333;
            color: white;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background-color: #555;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #777;
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
                margin: 20px;
            }
        }

        .links {
            text-align: center;
            margin: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="login">

            <h2>Login</h2>

            <input type="email" placeholder="Email">
            <input type="password" placeholder="Password">

            <button>Login</button>

        </div>

        <div class="signup">

            <h2>Sign Up</h2>

            <input type="text" placeholder="Name">
            <input type="email" placeholder="Email">
            <input type="password" placeholder="Password">

            <button>Register</button>

        </div>

    </div>

    <div class="links">
        <a href="../index/index.html">Home</a> |
        <a href="index.html">CSS Programs</a>
    </div>

</body>
</html>
