<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Fonts and Text</title>

    <style>

        body {
            font-family: Arial;
            padding: 30px;
            background-color: #f8fafc;
        }

        .heading {
            font-family: Georgia;
            font-size: 35px;
            font-weight: bold;
            color: #2563eb;
        }

        .paragraph {
            font-size: 20px;
            font-style: italic;
            line-height: 1.8;
            text-align: justify;
        }

        .underline {
            text-decoration: underline;
        }

        .uppercase {
            text-transform: uppercase;
            letter-spacing: 3px;
        }

    </style>

</head>

<body>

    <h1 class="heading">
        CSS Font Properties
    </h1>

    <p class="paragraph">
        CSS provides many properties for controlling
        the appearance and formatting of text.
    </p>

    <p class="underline">
        This text is underlined.
    </p>

    <p class="uppercase">
        This text is uppercase.
    </p>

    <a href="../index/index.html">Home</a> |
    <a href="index.html">CSS Programs</a>

</body>
</html>
