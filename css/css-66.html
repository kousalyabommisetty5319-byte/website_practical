<!DOCTYPE html>
<html>
<head>
    <title>CSS 66 - Keyframe Animations</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }

        .box {
            width: 100px;
            height: 100px;
            background: #ddd;
            margin: 50px auto;

            animation: moveBox 3s infinite alternate;
        }

        @keyframes moveBox {
            0% {
                transform: translateX(-150px);
            }

            50% {
                transform: translateX(0);
                border-radius: 50%;
            }

            100% {
                transform: translateX(150px);
                border-radius: 0;
            }
        }

        .text {
            animation: fadeText 2s infinite alternate;
            font-size: 25px;
        }

        @keyframes fadeText {
            from {
                opacity: 0.2;
            }

            to {
                opacity: 1;
            }
        }

        .back {
            display: block;
            margin: 30px;
        }
    </style>
</head>

<body>

<h1>CSS Keyframe Animation</h1>

<div class="box"></div>

<p class="text">This text is animated</p>

</body>
</html>
