<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Float and Clear</title>

    <style>

        body {
            font-family: Arial;
            padding: 30px;
        }

        .image {
            width: 180px;
            height: 120px;
            background-color: #60a5fa;
            float: left;
            margin-right: 20px;
            padding: 20px;
        }

        .clear {
            clear: both;
            background-color: #dcfce7;
            padding: 20px;
            margin-top: 20px;
        }

    </style>

</head>

<body>

    <h1>Float and Clear</h1>

    <div class="image">
        Floated Box
    </div>

    <p>
        This paragraph flows around the floated box.
        The float property allows an element to move
        to the left or right of its container.
    </p>

    <div class="clear">
        This section uses clear: both.
    </div>

    <br>

    <a href="../index/index.html">Home</a> |
    <a href="index.html">CSS Programs</a>

</body>
</html>
