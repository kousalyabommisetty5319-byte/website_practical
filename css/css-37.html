<!DOCTYPE html>
<html>
<head>
    <title>CSS Visibility</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 40px;
        }

        .visible {
            padding: 30px;
            background-color: #ddd;
            margin: 20px;
        }

        .hidden {
            padding: 30px;
            background-color: #999;
            margin: 20px;
            visibility: hidden;
        }

        .normal {
            padding: 30px;
            background-color: #ccc;
            margin: 20px;
        }

        a {
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>Visibility Property</h1>

    <div class="visible">
        Visible Element
    </div>

    <div class="hidden">
        Hidden Element
    </div>

    <div class="normal">
        This element still appears.
    </div>

    <p>
        <b>visibility: hidden</b> hides the element but keeps its space.
    </p>

    <a href="../index/index.html">Home</a> |
    <a href="index.html">CSS Programs</a>

</body>
</html>
