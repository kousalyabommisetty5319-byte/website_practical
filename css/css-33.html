<!DOCTYPE html>
<html>
<head>
    <title>Opacity and Transparency</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 30px;
        }

        .box {
            width: 250px;
            padding: 40px;
            margin: 30px auto;
            background-color: #333;
            color: white;
        }

        .opacity-100 {
            opacity: 1;
        }

        .opacity-50 {
            opacity: 0.5;
        }

        .opacity-20 {
            opacity: 0.2;
        }

        .transparent {
            background-color: rgba(0, 0, 0, 0.3);
            color: black;
        }

        a {
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>Opacity and Transparency</h1>

    <div class="box opacity-100">
        Opacity 100%
    </div>

    <div class="box opacity-50">
        Opacity 50%
    </div>

    <div class="box opacity-20">
        Opacity 20%
    </div>

    <div class="box transparent">
        Transparent Background
    </div>

    <a href="../index/index.html">Home</a> |
    <a href="index.html">CSS Programs</a>

</body>
</html>
