<!DOCTYPE html>
<html>
<head>
    <title>Responsive Contact Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            background-color: #f4f4f4;
            padding: 30px;
        }

        .contact {
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 35px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            background-color: #333;
            color: white;
        }

        @media (max-width: 500px) {
            body {
                padding: 10px;
            }

            .contact {
                padding: 20px;
            }
        }

        .links {
            text-align: center;
            margin: 20px;
        }
    </style>
</head>

<body>

    <div class="contact">

        <h1>Contact Us</h1>

        <form>

            <label>Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Subject</label>
            <input type="text" placeholder="Enter subject">

            <label>Message</label>
            <textarea rows="6" placeholder="Enter your message"></textarea>

            <button type="submit">Send Message</button>

        </form>

    </div>

    <div class="links">
        <a href="../index/index.html">Home</a> |
        <a href="index.html">CSS Programs</a>
    </div>

</body>
</html>
