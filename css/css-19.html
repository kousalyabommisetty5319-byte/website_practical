<!DOCTYPE html>
<html>
<head>
    <title>Responsive Navigation Menu</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        nav {
            background-color: #333;
            display: flex;
            justify-content: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 18px 25px;
        }

        nav a:hover {
            background-color: #555;
        }

        .content {
            text-align: center;
            padding: 60px;
        }

        @media (max-width: 600px) {

            nav {
                flex-direction: column;
                text-align: center;
            }

            nav a {
                border-bottom: 1px solid #555;
            }
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Projects</a>
    <a href="#">Contact</a>
</nav>

<div class="content">

    <h1>Responsive Navigation Menu</h1>

    <p>
        Resize the browser window to see the responsive navigation.
    </p>

</div>

<div class="links">
    <a href="../index/index.html">Home</a> |
    <a href="index.html">CSS Programs</a>
</div>

</body>
</html>
