<!DOCTYPE html>
<html>
<head>
    <title>Responsive Photo Gallery</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            padding: 30px;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }

        @media (max-width: 800px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }

        .links {
            text-align: center;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<h1>Responsive Photo Gallery</h1>

<div class="gallery">

    <img src="https://picsum.photos/400/300?1" alt="Image 1">
    <img src="https://picsum.photos/400/300?2" alt="Image 2">
    <img src="https://picsum.photos/400/300?3" alt="Image 3">
    <img src="https://picsum.photos/400/300?4" alt="Image 4">
    <img src="https://picsum.photos/400/300?5" alt="Image 5">
    <img src="https://picsum.photos/400/300?6" alt="Image 6">
    <img src="https://picsum.photos/400/300?7" alt="Image 7">
    <img src="https://picsum.photos/400/300?8" alt="Image 8">

</div>

<div class="links">
    <a href="../index/index.html">Home</a> |
    <a href="index.html">CSS Programs</a>
</div>

</body>
</html>
