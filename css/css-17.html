<!DOCTYPE html>
<html>
<head>
    <title>CSS Transitions and Transformations</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f4;
        }

        .box {
            width: 150px;
            height: 150px;
            background-color: #333;
            color: white;
            margin: 50px auto;
            display: flex;
            justify-content: center;
            align-items: center;

            transition: 0.5s;
        }

        .box:hover {
            transform: scale(1.2) rotate(10deg);
            background-color: #666;
        }

        a {
            margin: 10px;
        }
    </style>
</head>

<body>

<h1>Transition and Transformation</h1>

<div class="box">
    Hover Me
</div>

<a href="../index/index.html">Home</a> |
<a href="index.html">CSS Programs</a>

</body>
</html>
