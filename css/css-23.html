<!DOCTYPE html>
<html>
<head>
    <title>Product Card</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f5f5f5;
            padding: 40px;
        }

        .card {
            width: 300px;
            background-color: white;
            margin: auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 10px #aaa;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .content {
            padding: 20px;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="card">

    <img src="https://picsum.photos/300/200" alt="Product">

    <div class="content">

        <h2>Wireless Headphones</h2>

        <p>Comfortable wireless headphones with high-quality sound.</p>

        <p class="price">₹1,999</p>

        <button>Add to Cart</button>

    </div>

</div>

<div class="links">
    <a href="../index/index.html">Home</a> |
    <a href="index.html">CSS Programs</a>
</div>

</body>
</html>
