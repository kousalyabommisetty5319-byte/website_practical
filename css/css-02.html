<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>CSS Selectors</title>

    <style>

        /* Element selector */
        h1 {
            color: blue;
        }

        /* Class selector */
        .student {
            color: green;
            background-color: #dcfce7;
            padding: 15px;
        }

        /* ID selector */
        #special {
            color: red;
            font-size: 25px;
        }

        /* Universal selector */
        * {
            box-sizing: border-box;
        }

        /* Grouping selector */
        h2, h3 {
            font-family: Arial;
        }

        body {
            font-family: Arial;
            padding: 30px;
            background-color: #f8fafc;
        }

    </style>

</head>

<body>

    <h1>CSS Selectors</h1>

    <h2>Element Selector</h2>

    <p>
        This paragraph is styled using an element selector.
    </p>

    <h2>Class Selector</h2>

    <p class="student">
        This paragraph uses a class selector.
    </p>

    <h2>ID Selector</h2>

    <p id="special">
        This paragraph uses an ID selector.
    </p>

    <br>

    <a href="../index/index.html">Home</a> |
    <a href="index.html">CSS Programs</a>

</body>
</html>
