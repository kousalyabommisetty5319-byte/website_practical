<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>CSS Box Model</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f1f5f9;
            padding: 30px;
        }

        .box {
            width: 300px;

            /* Content */
            height: 150px;

            /* Padding */
            padding: 30px;

            /* Border */
            border: 10px solid #2563eb;

            /* Margin */
            margin: 50px auto;

            background-color: #bfdbfe;

            text-align: center;
        }

    </style>

</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="box">

        Content Area

        <br><br>

        Padding → Border → Margin

    </div>

</body>
</html>
