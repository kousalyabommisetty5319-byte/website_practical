<!DOCTYPE html>
<html>
<head>
    <title>Responsive Footer</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .content {
            min-height: 500px;
            padding: 40px;
            text-align: center;
        }

        footer {
            background-color: #222;
            color: white;
            padding: 30px;
        }

        .footer-container {
            display: flex;
            justify-content: space-around;
            gap: 20px;
        }

        .footer-section {
            flex: 1;
            text-align: center;
        }

        .footer-section a {
            display: block;
            color: white;
            text-decoration: none;
            margin: 8px;
        }

        .footer-section a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .footer-container {
                flex-direction: column;
            }
        }

        .links {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="content">

        <h1>Responsive Footer</h1>

        <p>
            Resize the browser window to see the responsive footer.
        </p>

    </div>

    <footer>

        <div class="footer-container">

            <div class="footer-section">
                <h3>About</h3>
                <p>My Practical Website</p>
            </div>

            <div class="footer-section">
                <h3>Links</h3>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </div>

            <div class="footer-section">
                <h3>Contact</h3>
                <p>Email: student@example.com</p>
            </div>

        </div>

    </footer>

    <div class="links">
        <a href="../index/index.html">Home</a> |
        <a href="index.html">CSS Programs</a>
    </div>

</body>
</html>
