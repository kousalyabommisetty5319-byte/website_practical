<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            padding: 30px;
        }

        h1 {
            color: blue;
        }

        .box {
            padding: 20px;
            background-color: #eee;
        }

        #special {
            color: red;
        }

        input[type="text"] {
            border: 2px solid green;
            padding: 10px;
        }

        h2, p {
            margin: 10px;
        }
    </style>
</head>

<body>

<h1>CSS Selector Examples</h1>

<div class="box">

    <h2>Element Selector</h2>

    <p>Paragraph styled using element selector.</p>

    <p id="special">ID selector example.</p>

    <p class="box">Class selector example.</p>

    <input type="text" placeholder="Attribute selector">

</div>

</body>
</html>
