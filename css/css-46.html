<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Grid</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 30px;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px #aaa;
        }

        .large {
            grid-column: span 2;
        }

        @media (max-width: 700px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .large {
                grid-column: span 1;
            }
        }

        .links {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>Student Dashboard</h1>

    <div class="dashboard">

        <div class="card large">
            <h2>Welcome</h2>
            <p>Welcome to your student dashboard.</p>
        </div>

        <div class="card">
            <h2>Attendance</h2>
            <p>85%</p>
        </div>

        <div class="card">
            <h2>Assignments</h2>
            <p>8 Completed</p>
        </div>

        <div class="card">
            <h2>Projects</h2>
            <p>3 Projects</p>
        </div>

        <div class="card">
            <h2>CGPA</h2>
            <p>9.0</p>
        </div>

    </div>

    <div class="links">
        <a href="../index/index.html">Home</a> |
        <a href="index.html">CSS Programs</a>
    </div>

</body>
</html>
