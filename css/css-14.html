<!DOCTYPE html>
<html>
<head>
    <title>CSS Flexbox</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        .flex-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            min-height: 300px;
        }

        .card {
            background-color: white;
            width: 200px;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 8px #aaa;
        }

        .card h2 {
            margin-top: 0;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<h1>Flexbox Example</h1>

<div class="flex-container">

    <div class="card">
        <h2>HTML</h2>
        <p>Structure of webpage</p>
    </div>

    <div class="card">
        <h2>CSS</h2>
        <p>Style of webpage</p>
    </div>

    <div class="card">
        <h2>JavaScript</h2>
        <p>Functionality of webpage</p>
    </div>

</div>

<a href="../index/index.html">Home</a>
<a href="index.html">CSS Programs</a>

</body>
</html>
