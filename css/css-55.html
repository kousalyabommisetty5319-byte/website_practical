<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Webpage</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #f8f8f8;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
            background-image: url("https://picsum.photos/1200/500?food");
            background-size: cover;
            background-position: center;
            color: white;
        }

        .hero h1 {
            font-size: 45px;
        }

        .menu {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .items {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .item {
            background-color: white;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px #aaa;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 700px) {
            .items {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 30px;
            }
        }

        .links {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>

        <h1>Food Corner</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">Menu</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>

    </header>

    <section class="hero">

        <h1>Delicious Food</h1>

        <p>Fresh food made with love.</p>

    </section>

    <section class="menu">

        <h2>Our Menu</h2>

        <div class="items">

            <div class="item">
                <h3>Pizza</h3>
                <p>₹250</p>
            </div>

            <div class="item">
                <h3>Burger</h3>
                <p>₹150</p>
            </div>

            <div class="item">
                <h3>Pasta</h3>
                <p>₹200</p>
            </div>

        </div>

    </section>

    <footer>
        <p>© 2026 Food Corner</p>
    </footer>

    <div class="links">
        <a href="../index/index.html">Home</a> |
        <a href="index.html">CSS Programs</a>
    </div>

</body>
</html>
