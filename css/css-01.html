<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inline Internal External CSS</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f8fafc;
            padding: 30px;
        }

        .internal {
            color: blue;
            background-color: lightblue;
            padding: 20px;
        }

    </style>

    <!-- External CSS using Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

    <h1>Types of CSS</h1>

    <h2>1. Inline CSS</h2>

    <p style="color: red; font-size: 22px;">
        This paragraph uses Inline CSS.
    </p>

    <h2>2. Internal CSS</h2>

    <p class="internal">
        This paragraph uses Internal CSS.
    </p>

    <h2>3. External CSS</h2>

    <p class="text-success fs-4">
        This paragraph uses External CSS.
    </p>

    <br>

    <a href="../index/index.html">Home</a> |
    <a href="index.html">CSS Programs</a>

</body>
</html>
