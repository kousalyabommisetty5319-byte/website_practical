<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real-Time Form Validation</title>

<style>
body {
    font-family: Arial;
    background: #f0fdf4;
    padding: 40px;
}

.box {
    background: white;
    max-width: 500px;
    margin: auto;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 0 15px #aaa;
}

h2 {
    text-align: center;
    color: #16a34a;
}

input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    box-sizing: border-box;
}

.error {
    color: red;
    font-size: 14px;
}

.success {
    color: green;
    font-size: 14px;
}

button {
    width: 100%;
    padding: 10px;
    background: #16a34a;
    color: white;
    border: none;
    border-radius: 6px;
}

a {
    display: block;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="box">

<h2>Real-Time Form Validation</h2>

<form>

<label>Name:</label>
<input type="text" id="name">
<p id="nameMsg"></p>

<label>Email:</label>
<input type="text" id="email">
<p id="emailMsg"></p>

<label>Mobile:</label>
<input type="text" id="mobile">
<p id="mobileMsg"></p>

<button type="submit">Submit</button>

</form>

<a href="../index/index.html">⬅ Back to Main Index</a>
<a href="index.html">💻 JavaScript Programs</a

</div>

<script>

let name = document.getElementById("name");
let email = document.getElementById("email");
let mobile = document.getElementById("mobile");

name.addEventListener("input", function() {

    if (name.value.trim() === "") {
        document.getElementById("nameMsg").innerHTML = "Name is required";
        document.getElementById("nameMsg").className = "error";
    } else {
        document.getElementById("nameMsg").innerHTML = "✓ Valid name";
        document.getElementById("nameMsg").className = "success";
    }

});

email.addEventListener("input", function() {

    let pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!pattern.test(email.value)) {
        document.getElementById("emailMsg").innerHTML = "Enter a valid email";
        document.getElementById("emailMsg").className = "error";
    } else {
        document.getElementById("emailMsg").innerHTML = "✓ Valid email";
        document.getElementById("emailMsg").className = "success";
    }

});

mobile.addEventListener("input", function() {

    let pattern = /^[6-9][0-9]{9}$/;

    if (!pattern.test(mobile.value)) {
        document.getElementById("mobileMsg").innerHTML = "Enter a valid 10-digit mobile number";
        document.getElementById("mobileMsg").className = "error";
    } else {
        document.getElementById("mobileMsg").innerHTML = "✓ Valid mobile number";
        document.getElementById("mobileMsg").className = "success";
    }

});

</script>

</body>
</html>
