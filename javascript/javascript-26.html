<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 40px;
            background: #f4f4f4;
        }

        .navigation {
            margin-bottom: 30px;
        }

        .navigation a {
            text-decoration: none;
            color: #dd2476;
            font-weight: bold;
            margin: 10px;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 10px #ccc;
        }

        #clock {
            font-size: 45px;
            font-weight: bold;
            color: #dd2476;
            margin: 30px;
        }
    </style>
</head>

<body>

    <div class="navigation">
        <a href="../index/index.html">🏠 Home</a> |
        <a href="index.html">💻 JavaScript Programs</a>
    </div>

    <div class="box">

        <h1>Digital Clock</h1>

        <div id="clock"></div>

    </div>

    <script>
        function showTime() {

            let now = new Date();

            let hours = String(now.getHours()).padStart(2, "0");
            let minutes = String(now.getMinutes()).padStart(2, "0");
            let seconds = String(now.getSeconds()).padStart(2, "0");

            document.getElementById("clock").textContent =
                hours + ":" + minutes + ":" + seconds;
        }

        setInterval(showTime, 1000);

        showTime();
    </script>

</body>
</html>
