<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #8e2de2, #4a00e0);
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        button {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #8e2de2;
            color: white;
        }

        a {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>JavaScript Quiz</h1>

        <h2 id="question"></h2>
        <div id="options"></div>
        <p id="result"></p>

        <button onclick="nextQuestion()">Next Question</button>

        <a href="../index/index.html">🏠 Home</a>
        <a href="index.html">⬅️ Back to JavaScript Programs</a>
    </div>

    <script>
        const questions = [
            {
                question: "Which language is used for web page structure?",
                options: ["HTML", "CSS", "Python", "SQL"],
                answer: "HTML"
            },
            {
                question: "Which language is used for web page styling?",
                options: ["Java", "CSS", "C", "Python"],
                answer: "CSS"
            },
            {
                question: "Which keyword declares a variable in JavaScript?",
                options: ["var", "int", "string", "define"],
                answer: "var"
            },
            {
                question: "Which method prints output in the console?",
                options: ["print()", "console.log()", "display()", "write()"],
                answer: "console.log()"
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let selectedAnswer = "";

        function loadQuestion() {
            let question = questions[currentQuestion];

            document.getElementById("question").textContent =
                question.question;

            let optionsDiv = document.getElementById("options");
            optionsDiv.innerHTML = "";

            selectedAnswer = "";

            question.options.forEach(function (option) {
                let button = document.createElement("button");
                button.textContent = option;

                button.onclick = function () {
                    selectedAnswer = option;
                    document.getElementById("result").textContent =
                        "Selected: " + option;
                };

                optionsDiv.appendChild(button);
            });
        }

        function nextQuestion() {
            if (selectedAnswer === "") {
                alert("Please select an answer.");
                return;
            }

            if (selectedAnswer === questions[currentQuestion].answer) {
                score++;
            }

            currentQuestion++;

            if (currentQuestion < questions.length) {
                loadQuestion();
                document.getElementById("result").textContent = "";
            } else {
                document.getElementById("question").textContent =
                    "Quiz Completed!";

                document.getElementById("options").innerHTML = "";

                document.getElementById("result").textContent =
                    "Your score is " + score + " out of " + questions.length;
            }
        }

        loadQuestion();
    </script>
</body>
</html>
