<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen Dimensions</title>
<style>
body {
    font-family: Arial;
    background: #ecfdf5;
    padding: 40px;
    text-align: center;
}
.box {
    background: white;
    max-width: 500px;
    margin: auto;
    padding: 25px;
    border-radius: 15px;
}
button {
    padding: 10px;
    background: #059669;
    color: white;
    border: none;
    border-radius: 5px;
}
</style>
</head>
<body>

<div class="box">
<h2>Screen Dimensions</h2>

<button onclick="showScreenSize()">Show Screen Size</button>

<p id="result"></p>

<a href="../index/index.html">⬅ Back to Main Index</a>
<a href="index.html">💻 JavaScript Programs</a
</div>

<script>
function showScreenSize() {
    document.getElementById("result").innerHTML =
        "Screen Width: " + screen.width + " pixels<br>" +
        "Screen Height: " + screen.height + " pixels";
}
</script>

</body>
</html>
