<!DOCTYPE html>
<html>
<head>
    <title>JavaScript 51 - Armstrong Number</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #e8f5e9;
            padding: 40px;
        }

        .box {
            background-color: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 10px;
        }

        input {
            padding: 10px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
        }
    </style>
</head>

<body>

<div class="navigation">
    <a href="../index/index.html">🏠 Home</a> |
    <a href="index.html">💻 JavaScript Programs</a>
</div>

<div class="box">

    <h1>Armstrong Number</h1>

    <input type="number" id="number" placeholder="Enter number">

    <button onclick="checkArmstrong()">Check</button>

    <h2 id="result"></h2>

</div>

<script>

function checkArmstrong() {

    let number = Number(document.getElementById("number").value);

    let original = number;
    let digits = String(number).length;
    let sum = 0;

    while (number > 0) {

        let digit = number % 10;

        sum += Math.pow(digit, digits);

        number = Math.floor(number / 10);
    }

    if (sum === original) {

        document.getElementById("result").innerHTML =
            original + " is an Armstrong number.";

    } else {

        document.getElementById("result").innerHTML =
            original + " is not an Armstrong number.";
    }
}

</script>

</body>
</html>
