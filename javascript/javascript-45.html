<!DOCTYPE html>
<html>
<head>
    <title>JavaScript 45 - localStorage</title>

    <style>
        body {
            font-family: Arial;
            background-color: #fff3e0;
            text-align: center;
            padding: 40px;
        }

        .box {
            background-color: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 10px;
        }

        input {
            padding: 10px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        #output {
            font-size: 20px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="navigation">
    <a href="../index/index.html">🏠 Home</a> |
    <a href="index.html">💻 JavaScript Programs</a>
</div>

<div class="box">

    <h1>localStorage</h1>

    <input type="text" id="name" placeholder="Enter your name">

    <br>

    <button onclick="saveData()">Save</button>
    <button onclick="getData()">Retrieve</button>
    <button onclick="deleteData()">Delete</button>

    <div id="output"></div>

</div>

<script>

function saveData() {

    let name = document.getElementById("name").value;

    localStorage.setItem("username", name);

    document.getElementById("output").innerHTML =
        "Data saved successfully!";
}

function getData() {

    let name = localStorage.getItem("username");

    if (name) {
        document.getElementById("output").innerHTML =
            "Stored Name: " + name;
    } else {
        document.getElementById("output").innerHTML =
            "No data found.";
    }
}

function deleteData() {

    localStorage.removeItem("username");

    document.getElementById("output").innerHTML =
        "Data deleted!";
}

</script>

</body>
</html>
