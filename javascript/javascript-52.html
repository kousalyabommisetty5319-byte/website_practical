<!DOCTYPE html>
<html>
<head>
    <title>JavaScript 52 - Perfect Number</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #fce4ec;
            padding: 40px;
        }

        .box {
            background-color: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 10px;
        }

        input {
            padding: 10px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
        }
    </style>
</head>

<body>

<div class="navigation">
    <a href="../index/index.html">🏠 Home</a> |
    <a href="index.html">💻 JavaScript Programs</a>
</div>

<div class="box">

    <h1>Perfect Number</h1>

    <input type="number" id="number" placeholder="Enter number">

    <button onclick="checkPerfect()">Check</button>

    <h2 id="result"></h2>

</div>

<script>

function checkPerfect() {

    let number = Number(document.getElementById("number").value);

    let sum = 0;

    for (let i = 1; i <= number / 2; i++) {

        if (number % i === 0) {
            sum += i;
        }
    }

    if (number > 0 && sum === number) {

        document.getElementById("result").innerHTML =
            number + " is a perfect number.";

    } else {

        document.getElementById("result").innerHTML =
            number + " is not a perfect number.";
    }
}

</script>

</body>
</html>
