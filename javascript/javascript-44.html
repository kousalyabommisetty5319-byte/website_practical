<!DOCTYPE html>
<html>
<head>
    <title>JavaScript 44 - Display API Data</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f3e5f5;
            text-align: center;
            padding: 30px;
        }

        .box {
            background-color: white;
            padding: 30px;
            max-width: 800px;
            margin: auto;
            border-radius: 10px;
        }

        .user {
            background-color: #f5f5f5;
            margin: 10px;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="navigation">
    <a href="../index/index.html">🏠 Home</a> |
    <a href="index.html">💻 JavaScript Programs</a>
</div>

<div class="box">

    <h1>API Data</h1>

    <button onclick="loadUsers()">Load Users</button>

    <div id="users"></div>

</div>

<script>
function loadUsers() {

    fetch("https://jsonplaceholder.typicode.com/users")

    .then(response => response.json())

    .then(data => {

        let output = "";

        data.forEach(function(user) {

            output += `
                <div class="user">
                    <h3>${user.name}</h3>
                    <p>Email: ${user.email}</p>
                    <p>City: ${user.address.city}</p>
                </div>
            `;

        });

        document.getElementById("users").innerHTML = output;
    })

    .catch(error => {

        document.getElementById("users").innerHTML =
            "Unable to load data.";

    });
}
</script>

</body>
</html>
