<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Switcher</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
            background: white;
            color: #222;
            transition: 0.3s;
        }

        .container {
            max-width: 650px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px #aaa;
        }

        button, a {
            padding: 12px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        body.dark {
            background: #121212;
            color: white;
        }

        body.dark .container {
            background: #222;
            box-shadow: 0 0 15px #555;
        }

        body.dark button,
        body.dark a {
            background: #f1f1f1;
            color: #222;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Theme Switcher</h1>

        <p>
            Select a theme. Your choice will be saved using localStorage.
        </p>

        <button onclick="setTheme('light')">
            Light Mode
        </button>

        <button onclick="setTheme('dark')">
            Dark Mode
        </button>

        <p id="currentTheme"></p>

        <br>

        <a href="../index/index.html">🏠 Home</a>
        <a href="index.html">⬅️ Back to JavaScript Programs</a>
    </div>

    <script>
        function setTheme(theme) {
            if (theme === "dark") {
                document.body.classList.add("dark");
            } else {
                document.body.classList.remove("dark");
            }

            localStorage.setItem("selectedTheme", theme);
            showCurrentTheme();
        }

        function showCurrentTheme() {
            let theme = localStorage.getItem("selectedTheme") || "light";

            document.getElementById("currentTheme").textContent =
                "Current Theme: " + theme.toUpperCase();
        }

        function loadTheme() {
            let savedTheme =
                localStorage.getItem("selectedTheme") || "light";

            setTheme(savedTheme);
        }

        loadTheme();
    </script>
</body>
</html>
