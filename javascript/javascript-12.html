<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Largest and Smallest Array</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 40px;
        }

        .navigation {
            margin-bottom: 30px;
        }

        .navigation a {
            text-decoration: none;
            color: #dd2476;
            font-weight: bold;
            margin: 10px;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px #ccc;
        }

        input {
            width: 80%;
            padding: 12px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            background: #dd2476;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="navigation">
        <a href="../index/index.html">🏠 Home</a> |
        <a href="index.html">💻 JavaScript Programs</a>
    </div>

    <div class="box">
        <h1>Largest and Smallest Array</h1>

        <p>Enter numbers separated by commas</p>

        <input type="text" id="numbers" placeholder="10, 25, 5, 40, 15">

        <br>

        <button onclick="findValues()">Find</button>

        <div id="result"></div>
    </div>

    <script>
        function findValues() {

            let input = document.getElementById("numbers").value;

            let array = input.split(",").map(Number);

            let largest = Math.max(...array);
            let smallest = Math.min(...array);

            document.getElementById("result").innerHTML =
                "Array: " + array.join(", ") +
                "<br><br>Largest: " + largest +
                "<br>Smallest: " + smallest;
        }
    </script>

</body>
</html>
