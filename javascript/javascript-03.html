<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Largest of Three Numbers</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 40px;
        }

        .navigation {
            margin-bottom: 30px;
        }

        .navigation a {
            text-decoration: none;
            color: #dd2476;
            font-weight: bold;
            margin: 10px;
        }

        .box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px #ccc;
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 120px;
        }

        button {
            padding: 10px 20px;
            background: #dd2476;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #dd2476;
        }
    </style>
</head>

<body>

    <div class="navigation">
        <a href="../index/index.html">🏠 Home</a> |
        <a href="index.html">💻 JavaScript Programs</a>
    </div>

    <div class="box">
        <h1>Largest of Three Numbers</h1>

        <input type="number" id="a" placeholder="Number 1">
        <input type="number" id="b" placeholder="Number 2">
        <input type="number" id="c" placeholder="Number 3">

        <br><br>

        <button onclick="findLargest()">Find Largest</button>

        <div id="result"></div>
    </div>

    <script>
        function findLargest() {
            let a = Number(document.getElementById("a").value);
            let b = Number(document.getElementById("b").value);
            let c = Number(document.getElementById("c").value);

            let largest = Math.max(a, b, c);

            document.getElementById("result").textContent =
                "Largest number is: " + largest;
        }
    </script>

</body>
</html>
