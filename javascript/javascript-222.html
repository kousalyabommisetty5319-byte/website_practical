<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age Calculator</title>

<style>
body {
    font-family: Arial;
    background: #ecfeff;
    padding: 40px;
}

.box {
    background: white;
    max-width: 500px;
    margin: auto;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 0 15px #aaa;
}

h2 {
    text-align: center;
    color: #0891b2;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 12px;
    background: #0891b2;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

#result {
    margin-top: 20px;
    font-weight: bold;
    text-align: center;
}

a {
    display: block;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="box">

<h2>Age Calculator</h2>

<label>Date of Birth:</label>
<input type="date" id="dob">

<button onclick="calculateAge()">Calculate Age</button>

<p id="result"></p>

<a href="../index/index.html">⬅ Back to Main Index</a>
<a href="index.html">💻 JavaScript Programs</a

</div>

<script>

function calculateAge() {

    let dob = document.getElementById("dob").value;
    let result = document.getElementById("result");

    if (dob === "") {
        result.innerHTML = "Please select your date of birth.";
        result.style.color = "red";
        return;
    }

    let birthDate = new Date(dob);
    let today = new Date();

    let age = today.getFullYear() - birthDate.getFullYear();

    let month = today.getMonth() - birthDate.getMonth();

    if (
        month < 0 ||
        (month === 0 && today.getDate() < birthDate.getDate())
    ) {
        age--;
    }

    if (age < 0) {
        result.innerHTML = "Invalid date of birth.";
        result.style.color = "red";
    } else {
        result.innerHTML = "Your age is " + age + " years.";
        result.style.color = "green";
    }

}

</script>

</body>
</html>
