<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #56ccf2, #2f80ed);
            text-align: center;
            padding: 40px;
            color: white;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            color: black;
            padding: 25px;
            border-radius: 15px;
        }

        input, button {
            padding: 12px;
            margin: 8px;
            border-radius: 8px;
            border: 1px solid #aaa;
        }

        button, a {
            background: #2f80ed;
            color: white;
            border: none;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #eeeeee;
            border-radius: 10px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Weather Application</h1>

        <input type="text" id="city" placeholder="Enter city name">
        <button onclick="getWeather()">Get Weather</button>

        <div id="result">Enter a city to get weather information.</div>

        <a href="../index/index.html">🏠 Home</a>
        <a href="index.html">⬅️ Back to JavaScript Programs</a>
    </div>

    <script>
        async function getWeather() {
            let city = document.getElementById("city").value.trim();
            let result = document.getElementById("result");

            if (city === "") {
                result.textContent = "Please enter a city name.";
                return;
            }

            result.textContent = "Loading...";

            try {
                let locationResponse = await fetch(
                    "https://geocoding-api.open-meteo.com/v1/search?name=" +
                    encodeURIComponent(city) +
                    "&count=1&language=en&format=json"
                );

                let locationData = await locationResponse.json();

                if (!locationData.results) {
                    result.textContent = "City not found.";
                    return;
                }

                let place = locationData.results[0];

                let weatherResponse = await fetch(
                    "https://api.open-meteo.com/v1/forecast?latitude=" +
                    place.latitude +
                    "&longitude=" +
                    place.longitude +
                    "&current=temperature_2m,wind_speed_10m"
                );

                let weatherData = await weatherResponse.json();

                result.innerHTML = `
                    <h2>${place.name}</h2>
                    <p>Temperature: ${weatherData.current.temperature_2m}
                    ${weatherData.current_units.temperature_2m}</p>
                    <p>Wind Speed: ${weatherData.current.wind_speed_10m}
                    ${weatherData.current_units.wind_speed_10m}</p>
                `;
            } catch (error) {
                result.textContent = "Unable to fetch weather data.";
            }
        }
    </script>
</body>
</html>
