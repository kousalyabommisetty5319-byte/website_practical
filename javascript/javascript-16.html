<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Functions</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 40px;
        }

        .navigation {
            margin-bottom: 30px;
        }

        .navigation a {
            text-decoration: none;
            color: #dd2476;
            font-weight: bold;
            margin: 10px;
        }

        .box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px #ccc;
        }

        input {
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            background: #dd2476;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="navigation">
        <a href="../index/index.html">🏠 Home</a> |
        <a href="index.html">💻 JavaScript Programs</a>
    </div>

    <div class="box">
        <h1>Arrow Functions</h1>

        <input type="number" id="a" placeholder="Number 1">
        <input type="number" id="b" placeholder="Number 2">

        <br>

        <button onclick="calculate('add')">Add</button>
        <button onclick="calculate('multiply')">Multiply</button>

        <div id="result"></div>
    </div>

    <script>
        const add = (a, b) => a + b;

        const multiply = (a, b) => a * b;

        function calculate(operation) {

            let a = Number(document.getElementById("a").value);
            let b = Number(document.getElementById("b").value);

            let result;

            if (operation === "add") {
                result = add(a, b);
            } else {
                result = multiply(a, b);
            }

            document.getElementById("result").textContent =
                "Result = " + result;
        }
    </script>

</body>
</html>
