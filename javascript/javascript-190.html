<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name Validation</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2ff;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 15px;
        }

        input {
            padding: 12px;
            width: 90%;
        }

        button {
            padding: 12px 20px;
            margin-top: 15px;
            background: #4f46e5;
            color: white;
            border: none;
        }

        #message {
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Name Validation</h1>

    <label>Enter your name:</label><br><br>

    <input type="text" id="name">

    <br>

    <button onclick="validateName()">Validate</button>

    <p id="message"></p>

    <a href="../index/index.html">⬅ Back to Main Index</a>
    <a href="index.html">💻 JavaScript Programs</a

</div>

<script>

    function validateName() {

        let name = document.getElementById("name").value.trim();
        let message = document.getElementById("message");

        if (name === "") {
            message.innerHTML = "Name cannot be empty.";
            message.style.color = "red";
        }
        else if (/^[A-Za-z ]+$/.test(name)) {
            message.innerHTML = "Valid name!";
            message.style.color = "green";
        }
        else {
            message.innerHTML = "Name must contain alphabets only.";
            message.style.color = "red";
        }

    }

</script>

</body>
</html>
