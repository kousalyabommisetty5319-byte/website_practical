<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser Information</title>
<style>
body {
    font-family: Arial;
    background: #f1f5f9;
    padding: 30px;
}
.box {
    background: white;
    max-width: 650px;
    margin: auto;
    padding: 25px;
    border-radius: 15px;
}
button {
    padding: 10px;
    background: #334155;
    color: white;
    border: none;
    border-radius: 5px;
}
</style>
</head>
<body>

<div class="box">
<h2>Browser Information</h2>

<button onclick="displayBrowserInfo()">Display Information</button>

<div id="result"></div>

<a href="../index/index.html">⬅ Back to Main Index</a>
<a href="index.html">💻 JavaScript Programs</a
</div>

<script>
function displayBrowserInfo() {
    document.getElementById("result").innerHTML =
        "<p><strong>User Agent:</strong> " + navigator.userAgent + "</p>" +
        "<p><strong>Language:</strong> " + navigator.language + "</p>" +
        "<p><strong>Platform:</strong> " + navigator.platform + "</p>" +
        "<p><strong>Online:</strong> " + navigator.onLine + "</p>" +
        "<p><strong>Cookies Enabled:</strong> " + navigator.cookieEnabled + "</p>";
}
</script>

</body>
</html>
