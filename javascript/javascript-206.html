<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prevent Form Submission</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2ff;
            padding: 40px;
        }

        .box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            margin: 10px 0;
        }

        button {
            padding: 12px 25px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
        }

        #error {
            color: red;
        }

        #success {
            color: green;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Prevent Form Submission</h1>

    <form id="form">

        <input type="text" id="name" placeholder="Name">

        <input type="email" id="email" placeholder="Email">

        <button type="submit">Submit</button>

    </form>

    <p id="error"></p>
    <p id="success"></p>

    <a href="../index/index.html">⬅ Back to Main Index</a>
    <a href="index.html">💻 JavaScript Programs</a

</div>

<script>

    document.getElementById("form").addEventListener(
        "submit",
        function(event) {

            let name =
                document.getElementById("name").value.trim();

            let email =
                document.getElementById("email").value.trim();

            let error =
                document.getElementById("error");

            let success =
                document.getElementById("success");

            error.innerHTML = "";
            success.innerHTML = "";

            if (name === "" || email === "") {

                event.preventDefault();

                error.innerHTML =
                    "Validation failed. Form submission prevented.";

                return;
            }

            event.preventDefault();

            success.innerHTML =
                "Validation successful!";

        }
    );

</script>

</body>
</html>
