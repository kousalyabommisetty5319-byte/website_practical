<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>

    <style>
        body {
            font-family: Arial;
            background-color: #fce4ec;
            padding: 30px;
        }

        .box {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        .product {
            background-color: #f5f5f5;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }

        button {
            padding: 8px 12px;
            background-color: #e91e63;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Shopping Cart</h2>

    <div class="product">
        <b>Laptop</b>
        <p>Price: ₹50,000</p>
        <button onclick="addToCart('Laptop', 50000)">Add to Cart</button>
    </div>

    <div class="product">
        <b>Headphones</b>
        <p>Price: ₹2,000</p>
        <button onclick="addToCart('Headphones', 2000)">Add to Cart</button>
    </div>

    <div class="product">
        <b>Keyboard</b>
        <p>Price: ₹1,500</p>
        <button onclick="addToCart('Keyboard', 1500)">Add to Cart</button>
    </div>

    <h3>Cart</h3>

    <div id="cart"></div>

    <a href="../index/index.html">⬅ Back to Main Index</a>
    <a href="index.html">💻 JavaScript Programs</a

</div>

<script>

function addToCart(name, price) {

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart.push({
        name: name,
        price: price
    });

    localStorage.setItem("cart", JSON.stringify(cart));

    displayCart();
}

function displayCart() {

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    let output = document.getElementById("cart");

    if (cart.length === 0) {
        output.innerHTML = "Cart is empty.";
        return;
    }

    output.innerHTML = "";

    let total = 0;

    cart.forEach(function(item, index) {

        total += item.price;

        output.innerHTML += `
            <p>
                ${item.name} - ₹${item.price}
                <button onclick="removeItem(${index})">Remove</button>
            </p>
        `;

    });

    output.innerHTML += "<h3>Total: ₹" + total + "</h3>";
}

function removeItem(index) {

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart.splice(index, 1);

    localStorage.setItem("cart", JSON.stringify(cart));

    displayCart();
}

displayCart();

</script>

</body>
</html>
