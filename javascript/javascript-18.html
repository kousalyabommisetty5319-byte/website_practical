<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Methods</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 40px;
        }

        .navigation {
            margin-bottom: 30px;
        }

        .navigation a {
            text-decoration: none;
            color: #dd2476;
            font-weight: bold;
            margin: 10px;
        }

        .box {
            background: white;
            max-width: 700px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px #ccc;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            background: #dd2476;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #result {
            text-align: left;
            margin-top: 20px;
            line-height: 2;
        }
    </style>
</head>

<body>

    <div class="navigation">
        <a href="../index/index.html">🏠 Home</a> |
        <a href="index.html">💻 JavaScript Programs</a>
    </div>

    <div class="box">
        <h1>Array Methods</h1>

        <p>Array: 10, 20, 30, 40, 50</p>

        <button onclick="showMethods()">Show Methods</button>

        <div id="result"></div>
    </div>

    <script>
        function showMethods() {

            let numbers = [10, 20, 30, 40, 50];

            let doubled = numbers.map(n => n * 2);

            let filtered = numbers.filter(n => n > 25);

            let total = numbers.reduce((sum, n) => sum + n, 0);

            document.getElementById("result").innerHTML =
                "<b>Original:</b> " + numbers.join(", ") +
                "<br><b>Map:</b> " + doubled.join(", ") +
                "<br><b>Filter > 25:</b> " + filtered.join(", ") +
                "<br><b>Reduce Sum:</b> " + total +
                "<br><b>Includes 30:</b> " + numbers.includes(30);
        }
    </script>

</body>
</html>
