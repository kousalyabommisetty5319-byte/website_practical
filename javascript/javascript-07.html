<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibonacci Series</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 40px;
        }

        .navigation {
            margin-bottom: 30px;
        }

        .navigation a {
            text-decoration: none;
            color: #dd2476;
            font-weight: bold;
            margin: 10px;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px #ccc;
        }

        input {
            padding: 10px;
        }

        button {
            padding: 10px 20px;
            background: #dd2476;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            color: #dd2476;
            font-weight: bold;
            word-wrap: break-word;
        }
    </style>
</head>

<body>

    <div class="navigation">
        <a href="../index/index.html">🏠 Home</a> |
        <a href="index.html">💻 JavaScript Programs</a>
    </div>

    <div class="box">
        <h1>Fibonacci Series</h1>

        <input type="number" id="number" placeholder="Number of terms">

        <button onclick="generateFibonacci()">Generate</button>

        <div id="result"></div>
    </div>

    <script>
        function generateFibonacci() {

            let n = Number(
                document.getElementById("number").value
            );

            let a = 0;
            let b = 1;
            let series = "";

            for (let i = 1; i <= n; i++) {

                series = series + a + " ";

                let next = a + b;

                a = b;
                b = next;
            }

            document.getElementById("result").textContent = series;
        }
    </script>

</body>
</html>
