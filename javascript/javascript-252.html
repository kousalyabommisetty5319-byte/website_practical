<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear localStorage</title>

    <style>
        body {
            font-family: Arial;
            background-color: #fce4ec;
            padding: 30px;
        }

        .box {
            max-width: 500px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            background-color: #9c27b0;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>Clear All localStorage Data</h2>

        <button onclick="clearStorageData()">Clear All Data</button>

        <p id="message"></p>

        <a href="../index/index.html">⬅ Back to Main Index</a>
        <a href="index.html">💻 JavaScript Programs</a
    </div>

    <script>
        function clearStorageData() {
            localStorage.clear();

            document.getElementById("message").innerHTML =
                "All localStorage data has been cleared.";
        }
    </script>
</body>
</html>
