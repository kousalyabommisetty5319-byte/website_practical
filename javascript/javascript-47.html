<!DOCTYPE html>
<html>
<head>
    <title>JavaScript 47 - Interactive Webpage</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            text-align: center;
            background-color: #f5f5f5;
        }

        .navigation {
            padding: 15px;
        }

        header {
            background-color: #1976d2;
            color: white;
            padding: 30px;
        }

        .card {
            background-color: white;
            padding: 25px;
            margin: 30px auto;
            max-width: 600px;
            border-radius: 10px;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            cursor: pointer;
        }

        #message {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="navigation">
    <a href="../index/index.html">🏠 Home</a> |
    <a href="index.html">💻 JavaScript Programs</a>
</div>

<header>

    <h1>My Interactive Webpage</h1>

    <p>HTML + CSS + JavaScript</p>

</header>

<div class="card">

    <h2>Welcome!</h2>

    <p id="message">
        Click the button to interact with the webpage.
    </p>

    <button onclick="changeMessage()">
        Change Message
    </button>

    <button onclick="changeBackground()">
        Change Background
    </button>

</div>

<script>

function changeMessage() {

    document.getElementById("message").innerHTML =
        "Hello! JavaScript changed this message.";
}

function changeBackground() {

    document.body.style.backgroundColor = "#fff3e0";
}

</script>

</body>
</html>
