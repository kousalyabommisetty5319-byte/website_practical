<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Calculator</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 40px;
            background: #f4f4f4;
        }

        .navigation {
            margin-bottom: 30px;
        }

        .navigation a {
            text-decoration: none;
            color: #dd2476;
            font-weight: bold;
            margin: 10px;
        }

        .box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px #ccc;
        }

        input {
            width: 80%;
            padding: 12px;
            margin: 8px;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            background: #dd2476;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="navigation">
        <a href="../index/index.html">🏠 Home</a> |
        <a href="index.html">💻 JavaScript Programs</a>
    </div>

    <div class="box">

        <h1>Simple Calculator</h1>

        <input type="number" id="num1" placeholder="First number">

        <input type="number" id="num2" placeholder="Second number">

        <br>

        <button onclick="calculate('+')">+</button>
        <button onclick="calculate('-')">−</button>
        <button onclick="calculate('*')">×</button>
        <button onclick="calculate('/')">÷</button>

        <div id="result"></div>

    </div>

    <script>
        function calculate(operator) {

            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);

            let result;

            if (operator === "+") {
                result = a + b;
            } else if (operator === "-") {
                result = a - b;
            } else if (operator === "*") {
                result = a * b;
            } else if (operator === "/") {

                if (b === 0) {
                    document.getElementById("result").textContent =
                        "Cannot divide by zero";
                    return;
                }

                result = a / b;
            }

            document.getElementById("result").textContent =
                "Result = " + result;
        }
    </script>

</body>
</html>
