<!DOCTYPE html>
<html>
<head>
    <title>JavaScript 63 - Vowels and Consonants</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #fce4ec;
            padding: 30px;
        }

        .box {
            background: white;
            padding: 25px;
            max-width: 600px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        input, button {
            padding: 10px;
            margin: 8px;
        }

        button {
            background: #e91e63;
            color: white;
            border: none;
            border-radius: 5px;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Count Vowels and Consonants</h1>

    <input type="text" id="text" placeholder="Enter a string">

    <button onclick="countLetters()">Count</button>

    <div id="result"></div>

    <div class="navigation">
        <a href="../index/index.html">🏠 Home</a> |
        <a href="index.html">💻 JavaScript Programs</a>
    </div>

</div>

<script>

function countLetters() {

    let text = document.getElementById("text").value;

    let vowels = 0;
    let consonants = 0;

    for (let char of text.toLowerCase()) {

        if (/[a-z]/.test(char)) {

            if ("aeiou".includes(char)) {
                vowels++;
            } else {
                consonants++;
            }
        }
    }

    document.getElementById("result").innerHTML =
        "Vowels = " + vowels +
        "<br>Consonants = " + consonants;
}

</script>

</body>
</html>
