<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Background Color</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 40px;
            background: #f4f4f4;
        }

        .navigation {
            margin-bottom: 30px;
        }

        .navigation a {
            text-decoration: none;
            color: #dd2476;
            font-weight: bold;
            margin: 10px;
        }

        .box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px #ccc;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .pink {
            background: #dd2476;
        }

        .blue {
            background: #2196f3;
        }

        .green {
            background: #28a745;
        }
    </style>
</head>

<body>

    <div class="navigation">
        <a href="../index/index.html">🏠 Home</a> |
        <a href="index.html">💻 JavaScript Programs</a>
    </div>

    <div class="box">

        <h1>Change Background Color</h1>

        <button class="pink" onclick="changeColor('#ffd6e8')">
            Pink
        </button>

        <button class="blue" onclick="changeColor('#d6ecff')">
            Blue
        </button>

        <button class="green" onclick="changeColor('#d8f8df')">
            Green
        </button>

    </div>

    <script>
        function changeColor(color) {
            document.body.style.backgroundColor = color;
        }
    </script>

</body>
</html>
