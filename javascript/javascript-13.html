<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort Array</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 40px;
        }

        .navigation {
            margin-bottom: 30px;
        }

        .navigation a {
            text-decoration: none;
            color: #dd2476;
            font-weight: bold;
            margin: 10px;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px #ccc;
        }

        input {
            width: 80%;
            padding: 12px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            background: #dd2476;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 19px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="navigation">
        <a href="../index/index.html">🏠 Home</a> |
        <a href="index.html">💻 JavaScript Programs</a>
    </div>

    <div class="box">
        <h1>Sort an Array</h1>

        <input type="text" id="numbers"
               placeholder="50, 10, 30, 20, 40">

        <br>

        <button onclick="sortAscending()">Ascending</button>
        <button onclick="sortDescending()">Descending</button>

        <div id="result"></div>
    </div>

    <script>
        function getArray() {
            return document.getElementById("numbers")
                .value
                .split(",")
                .map(Number);
        }

        function sortAscending() {
            let array = getArray();

            array.sort((a, b) => a - b);

            document.getElementById("result").textContent =
                "Ascending: " + array.join(", ");
        }

        function sortDescending() {
            let array = getArray();

            array.sort((a, b) => b - a);

            document.getElementById("result").textContent =
                "Descending: " + array.join(", ");
        }
    </script>

</body>
</html>
