<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Window Object</title>
<style>
body {
    font-family: Arial;
    background: #eef2ff;
    padding: 30px;
}
.box {
    background: white;
    max-width: 600px;
    margin: auto;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 0 10px #aaa;
}
button {
    padding: 10px;
    margin: 5px;
    background: #4f46e5;
    color: white;
    border: none;
    border-radius: 5px;
}
</style>
</head>
<body>

<div class="box">
<h2>Window Object Demonstration</h2>

<button onclick="showWindow()">Show Window Details</button>

<p id="result"></p>

<a href="../index/index.html">⬅ Back to Main Index</a>
<a href="index.html">💻 JavaScript Programs</a
</div>

<script>
function showWindow() {
    document.getElementById("result").innerHTML =
        "Window Width: " + window.innerWidth + " pixels<br>" +
        "Window Height: " + window.innerHeight + " pixels<br>" +
        "Screen Width: " + window.screen.width + " pixels<br>" +
        "Screen Height: " + window.screen.height + " pixels<br>" +
        "Current URL: " + window.location.href;
}
</script>

</body>
</html>
