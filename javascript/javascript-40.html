<div class="box">

    <h1>Classes and Objects</h1>

    <p id="output"></p>

</div>

<script>

class Student {

    constructor(name, age, course) {
        this.name = name;
        this.age = age;
        this.course = course;
    }

    display() {
        return "Name: " + this.name +
               "<br>Age: " + this.age +
               "<br>Course: " + this.course;
    }
}

let student1 = new Student(
    "Kousalya",
    19,
    "B.Tech CSE"
);

document.getElementById("output").innerHTML =
    student1.display();

</script>

</body>
</html>
