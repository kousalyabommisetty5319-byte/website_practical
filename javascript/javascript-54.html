<!DOCTYPE html>
<html>
<head>
    <title>JavaScript 54 - Power</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #fff3e0;
            padding: 30px;
        }

        .box {
            background: white;
            padding: 25px;
            max-width: 500px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        input, button {
            padding: 10px;
            margin: 8px;
        }

        button {
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 5px;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Power of a Number</h1>

    <input type="number" id="base" placeholder="Base">
    <input type="number" id="exponent" placeholder="Exponent">

    <button onclick="calculatePower()">Calculate</button>

    <div id="result"></div>

    <div class="navigation">
        <a href="../index/index.html">🏠 Home</a> |
        <a href="index.html">💻 JavaScript Programs</a>
    </div>
</div>

<script>
function calculatePower() {
    let base = Number(document.getElementById("base").value);
    let exponent = Number(document.getElementById("exponent").value);

    let result = Math.pow(base, exponent);

    document.getElementById("result").innerHTML =
        base + " ^ " + exponent + " = " + result;
}
</script>

</body>
</html>
