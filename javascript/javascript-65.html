<!DOCTYPE html>
<html>
<head>
    <title>JavaScript 65 - Character Frequency</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #fff3e0;
            padding: 30px;
        }

        .box {
            background: white;
            padding: 25px;
            max-width: 600px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        input, button {
            padding: 10px;
            margin: 8px;
        }

        button {
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 5px;
        }

        #result {
            margin-top: 20px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Character Frequency</h1>

    <input type="text" id="text" placeholder="Enter a string">

    <button onclick="findFrequency()">Find Frequency</button>

    <div id="result"></div>

    <div class="navigation">
        <a href="../index/index.html">🏠 Home</a> |
        <a href="index.html">💻 JavaScript Programs</a>
    </div>

</div>

<script>

function findFrequency() {

    let text = document.getElementById("text").value;

    let frequency = {};

    for (let char of text) {

        if (char === " ") {
            continue;
        }

        if (frequency[char]) {
            frequency[char]++;
        } else {
            frequency[char] = 1;
        }
    }

    let output = "";

    for (let char in frequency) {
        output += char + " : " + frequency[char] + "<br>";
    }

    document.getElementById("result").innerHTML = output;
}

</script>

</body>
</html>
