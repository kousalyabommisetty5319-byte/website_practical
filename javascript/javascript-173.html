<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Font Size</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f7fb;
            text-align: center;
            padding: 30px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            margin: auto;
        }

        button {
            padding: 12px;
            margin: 10px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #text {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Change Font Size Dynamically</h1>

        <p>
            <a href="../index/index.html">⬅ Back to Main Index</a>
            <a href="index.html">💻 JavaScript Programs</a
        </p>

        <p id="text">This text changes size dynamically.</p>

        <button onclick="increaseFont()">Increase Font Size</button>
        <button onclick="decreaseFont()">Decrease Font Size</button>

        <p id="sizeDisplay">Font Size: 20px</p>
    </div>

    <script>
        let size = 20;

        function increaseFont() {
            size += 2;
            document.getElementById("text").style.fontSize = size + "px";
            document.getElementById("sizeDisplay").innerHTML =
                "Font Size: " + size + "px";
        }

        function decreaseFont() {
            if (size > 10) {
                size -= 2;
            }

            document.getElementById("text").style.fontSize = size + "px";
            document.getElementById("sizeDisplay").innerHTML =
                "Font Size: " + size + "px";
        }
    </script>

</body>
</html>
