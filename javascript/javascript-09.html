<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Number</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 40px;
        }

        .navigation {
            margin-bottom: 30px;
        }

        .navigation a {
            text-decoration: none;
            color: #dd2476;
            font-weight: bold;
            margin: 10px;
        }

        .box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px #ccc;
        }

        input {
            padding: 10px;
        }

        button {
            padding: 10px 20px;
            background: #dd2476;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="navigation">
        <a href="../index/index.html">🏠 Home</a> |
        <a href="index.html">💻 JavaScript Programs</a>
    </div>

    <div class="box">
        <h1>Palindrome Number</h1>

        <input type="number" id="number" placeholder="Enter number">

        <button onclick="checkPalindrome()">Check</button>

        <div id="result"></div>
    </div>

    <script>
        function checkPalindrome() {

            let number =
                document.getElementById("number").value;

            let reverse =
                number.split("").reverse().join("");

            if (number === reverse) {

                document.getElementById("result").textContent =
                    number + " is a Palindrome";

            } else {

                document.getElementById("result").textContent =
                    number + " is not a Palindrome";
            }
        }
    </script>

</body>
</html>
