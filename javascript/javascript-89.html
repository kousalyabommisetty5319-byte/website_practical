<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard-Controlled Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #434343, #000000);
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: #222;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px black;
        }

        h1 {
            color: #00e5ff;
        }

        .game {
            width: 100%;
            max-width: 500px;
            height: 300px;
            background: #111;
            border: 3px solid #00e5ff;
            position: relative;
            margin: 25px auto;
            overflow: hidden;
        }

        .player {
            width: 40px;
            height: 40px;
            background: #ff4081;
            position: absolute;
            left: 10px;
            top: 10px;
            border-radius: 8px;
        }

        .output {
            background: #333;
            padding: 20px;
            border-radius: 10px;
            font-size: 18px;
        }

        a {
            display: inline-block;
            margin: 15px 5px;
            padding: 12px 18px;
            background: #00acc1;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🎮 Keyboard-Controlled Game</h1>

        <p>Use the arrow keys to move the player.</p>

        <div class="game" id="gameArea">
            <div class="player" id="player"></div>
        </div>

        <div class="output" id="output">
            Player position: X = 10, Y = 10
        </div>

        <a href="../index/index.html">🏠 Home</a>
        <a href="index.html">⬅️ Back to JavaScript Programs</a>
    </div>

    <script>
        const gameArea = document.getElementById("gameArea");
        const player = document.getElementById("player");
        const output = document.getElementById("output");

        let x = 10;
        let y = 10;
        const speed = 10;

        document.addEventListener("keydown", function(event) {

            if (event.key === "ArrowUp") {
                y -= speed;
            } else if (event.key === "ArrowDown") {
                y += speed;
            } else if (event.key === "ArrowLeft") {
                x -= speed;
            } else if (event.key === "ArrowRight") {
                x += speed;
            } else {
                return;
            }

            event.preventDefault();

            const maxX = gameArea.clientWidth - player.offsetWidth;
            const maxY = gameArea.clientHeight - player.offsetHeight;

            x = Math.max(0, Math.min(x, maxX));
            y = Math.max(0, Math.min(y, maxY));

            player.style.left = x + "px";
            player.style.top = y + "px";

            output.textContent =
                "Player position: X = " + x + ", Y = " + y;
        });
    </script>

</body>
</html>
