<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Required Field Validation</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2ff;
            padding: 30px;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            margin-top: 5px;
        }

        button {
            padding: 12px 25px;
            margin-top: 20px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        #success {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Required Field Validation</h1>

    <form id="myForm">

        <label>Name:</label>
        <input type="text" id="name">
        <span class="error" id="nameError"></span>

        <label>Email:</label>
        <input type="text" id="email">
        <span class="error" id="emailError"></span>

        <label>Message:</label>
        <textarea id="message"></textarea>
        <span class="error" id="messageError"></span>

        <br>

        <button type="submit">Submit</button>

        <p id="success"></p>

    </form>

    <a href="../index/index.html">⬅ Back to Main Index</a>
    <a href="index.html">💻 JavaScript Programs</a

</div>

<script>

    document.getElementById("myForm").addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            let valid = true;

            document.getElementById("nameError").innerHTML = "";
            document.getElementById("emailError").innerHTML = "";
            document.getElementById("messageError").innerHTML = "";
            document.getElementById("success").innerHTML = "";

            let name =
                document.getElementById("name").value.trim();

            let email =
                document.getElementById("email").value.trim();

            let message =
                document.getElementById("message").value.trim();

            if (name === "") {
                document.getElementById("nameError").innerHTML =
                    "Name is required.";
                valid = false;
            }

            if (email === "") {
                document.getElementById("emailError").innerHTML =
                    "Email is required.";
                valid = false;
            }

            if (message === "") {
                document.getElementById("messageError").innerHTML =
                    "Message is required.";
                valid = false;
            }

            if (valid) {

                document.getElementById("success").innerHTML =
                    "Form submitted successfully!";

                document.getElementById("myForm").reset();

            }

        }
    );

</script>

</body>
</html>
