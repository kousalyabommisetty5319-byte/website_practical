<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Regular Expression</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2ff;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        input {
            width: 90%;
            padding: 12px;
        }

        button {
            padding: 12px 25px;
            margin-top: 15px;
            background: #4f46e5;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Email Regular Expression</h1>

    <input type="text" id="email"
        placeholder="example@gmail.com">

    <br>

    <button onclick="validateEmail()">Validate</button>

    <p id="message"></p>

    <a href="../index/index.html">⬅ Back to Main Index</a>
    <a href="index.html">💻 JavaScript Programs</a

</div>

<script>

    function validateEmail() {

        let email =
            document.getElementById("email").value.trim();

        let pattern =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        let message =
            document.getElementById("message");

        if (pattern.test(email)) {

            message.innerHTML = "Valid email!";
            message.style.color = "green";

        }
        else {

            message.innerHTML = "Invalid email!";
            message.style.color = "red";

        }

    }

</script>

</body>
</html>
