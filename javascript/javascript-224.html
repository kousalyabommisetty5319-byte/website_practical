<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Salary Calculator</title>

<style>
body {
    font-family: Arial;
    background: #f0fdf4;
    padding: 40px;
}

.box {
    background: white;
    max-width: 500px;
    margin: auto;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 0 15px #aaa;
}

h2 {
    text-align: center;
    color: #16a34a;
}

input {
    width: 100%;
    padding: 10px;
    margin: 8px 0 15px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 12px;
    background: #16a34a;
    color: white;
    border: none;
    border-radius: 6px;
}

#result {
    margin-top: 20px;
    background: #dcfce7;
    padding: 15px;
    line-height: 1.8;
}

a {
    display: block;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="box">

<h2>Employee Salary Calculator</h2>

<label>Employee Name:</label>
<input type="text" id="name">

<label>Basic Salary:</label>
<input type="number" id="salary">

<button onclick="calculateSalary()">Calculate Salary</button>

<div id="result"></div>

<a href="../index/index.html">⬅ Back to Main Index</a>
<a href="index.html">💻 JavaScript Programs</a

</div>

<script>

function calculateSalary() {

    let name = document.getElementById("name").value;
    let basic = Number(document.getElementById("salary").value);

    if (name === "" || basic <= 0) {
        document.getElementById("result").innerHTML =
            "Please enter valid employee details.";
        return;
    }

    let hra = basic * 0.20;

    let da = basic * 0.10;

    let pf = basic * 0.12;

    let gross = basic + hra + da;

    let net = gross - pf;

    document.getElementById("result").innerHTML =
        "<strong>Employee:</strong> " + name + "<br>" +
        "<strong>Basic Salary:</strong> ₹" + basic.toFixed(2) + "<br>" +
        "<strong>HRA:</strong> ₹" + hra.toFixed(2) + "<br>" +
        "<strong>DA:</strong> ₹" + da.toFixed(2) + "<br>" +
        "<strong>PF:</strong> ₹" + pf.toFixed(2) + "<br>" +
        "<strong>Gross Salary:</strong> ₹" + gross.toFixed(2) + "<br>" +
        "<strong>Net Salary:</strong> ₹" + net.toFixed(2);

}

</script>

</body>
</html>
