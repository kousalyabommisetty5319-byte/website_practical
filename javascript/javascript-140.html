<!DOCTYPE html>
<html>
<head>
    <title>Sort Table Records</title>
</head>
<body>

<h2>Sort Student Records</h2>

<button onclick="sortTable()">Sort Names A-Z</button>

<br><br>

<table border="1" cellpadding="10" id="studentTable">
    <tr>
        <th>Name</th>
        <th>Course</th>
    </tr>

    <tr>
        <td>Ravi</td>
        <td>ECE</td>
    </tr>

    <tr>
        <td>Anu</td>
        <td>CSE</td>
    </tr>

    <tr>
        <td>Kiran</td>
        <td>IT</td>
    </tr>
</table>
<a href="../index/index.html">🏠 Home</a>
        <a href="index.html">⬅️ Back to JavaScript Programs</a>
<script>
function sortTable() {
    let table = document.getElementById("studentTable");

    let rows = Array.from(table.rows).slice(1);

    rows.sort(function(a, b) {
        return a.cells[0].textContent.localeCompare(
            b.cells[0].textContent
        );
    });

    rows.forEach(function(row) {
        table.appendChild(row);
    });
}
</script>

</body>
</html>
