<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alert Confirm Prompt</title>
<style>
body {
    font-family: Arial;
    background: #fff7ed;
    padding: 30px;
}
.box {
    background: white;
    max-width: 500px;
    margin: auto;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 0 10px #aaa;
}
button {
    padding: 10px;
    margin: 5px;
    background: #ea580c;
    color: white;
    border: none;
    border-radius: 5px;
}
</style>
</head>
<body>

<div class="box">
<h2>Alert, Confirm and Prompt</h2>

<button onclick="showAlert()">Alert</button>
<button onclick="showConfirm()">Confirm</button>
<button onclick="showPrompt()">Prompt</button>

<p id="result"></p>

<a href="../index/index.html">⬅ Back to Main Index</a>
<a href="index.html">💻 JavaScript Programs</a
</div>

<script>
function showAlert() {
    alert("This is an alert message!");
}

function showConfirm() {
    let answer = confirm("Do you want to continue?");

    if (answer) {
        document.getElementById("result").innerHTML =
            "You clicked OK.";
    } else {
        document.getElementById("result").innerHTML =
            "You clicked Cancel.";
    }
}

function showPrompt() {
    let name = prompt("Enter your name:");

    if (name !== null && name !== "") {
        document.getElementById("result").innerHTML =
            "Hello, " + name + "!";
    }
}
</script>

</body>
</html>
