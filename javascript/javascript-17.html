<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Methods</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 40px;
        }

        .navigation {
            margin-bottom: 30px;
        }

        .navigation a {
            text-decoration: none;
            color: #dd2476;
            font-weight: bold;
            margin: 10px;
        }

        .box {
            background: white;
            max-width: 650px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px #ccc;
        }

        input {
            width: 80%;
            padding: 12px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            background: #dd2476;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #result {
            text-align: left;
            margin-top: 20px;
            line-height: 2;
        }
    </style>
</head>

<body>

    <div class="navigation">
        <a href="../index/index.html">🏠 Home</a> |
        <a href="index.html">💻 JavaScript Programs</a>
    </div>

    <div class="box">
        <h1>String Methods</h1>

        <input type="text" id="text"
               placeholder="Enter a string">

        <br>

        <button onclick="showMethods()">Show Methods</button>

        <div id="result"></div>
    </div>

    <script>
        function showMethods() {

            let text = document.getElementById("text").value;

            document.getElementById("result").innerHTML =
                "<b>Original:</b> " + text +
                "<br><b>Length:</b> " + text.length +
                "<br><b>Uppercase:</b> " + text.toUpperCase() +
                "<br><b>Lowercase:</b> " + text.toLowerCase() +
                "<br><b>Trim:</b> " + text.trim() +
                "<br><b>First Character:</b> " + text.charAt(0);
        }
    </script>

</body>
</html>
