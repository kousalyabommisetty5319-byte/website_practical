<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff512f, #dd2476);
            padding: 25px;
            color: white;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            color: black;
            padding: 25px;
            border-radius: 15px;
        }

        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .product {
            width: 200px;
            padding: 15px;
            background: #f1f1f1;
            border-radius: 10px;
            text-align: center;
        }

        button, a {
            padding: 10px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            background: #dd2476;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        #cart {
            margin-top: 25px;
            padding: 20px;
            background: #eeeeee;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Online Shopping Cart</h1>

        <div class="products">
            <div class="product">
                <h3>Notebook</h3>
                <p>₹100</p>
                <button onclick="addToCart('Notebook', 100)">
                    Add to Cart
                </button>
            </div>

            <div class="product">
                <h3>Pen</h3>
                <p>₹50</p>
                <button onclick="addToCart('Pen', 50)">
                    Add to Cart
                </button>
            </div>

            <div class="product">
                <h3>Bag</h3>
                <p>₹800</p>
                <button onclick="addToCart('Bag', 800)">
                    Add to Cart
                </button>
            </div>

            <div class="product">
                <h3>Headphones</h3>
                <p>₹1200</p>
                <button onclick="addToCart('Headphones', 1200)">
                    Add to Cart
                </button>
            </div>
        </div>

        <div id="cart">
            <h2>Shopping Cart</h2>
            <div id="cartItems"></div>
            <h3>Total: ₹<span id="total">0</span></h3>
            <button onclick="clearCart()">Clear Cart</button>
        </div>

        <br>

        <a href="../index/index.html">🏠 Home</a>
        <a href="index.html">⬅️ Back to JavaScript Programs</a>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem("shoppingCart")) || [];

        function addToCart(name, price) {
            cart.push({
                name: name,
                price: price
            });

            saveCart();
            displayCart();
        }

        function saveCart() {
            localStorage.setItem("shoppingCart", JSON.stringify(cart));
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            saveCart();
            displayCart();
        }

        function clearCart() {
            cart = [];
            saveCart();
            displayCart();
        }

        function displayCart() {
            let cartItems = document.getElementById("cartItems");
            let total = 0;

            cartItems.innerHTML = "";

            if (cart.length === 0) {
                cartItems.innerHTML = "<p>Your cart is empty.</p>";
            }

            cart.forEach(function (item, index) {
                total += item.price;

                let itemElement = document.createElement("p");

                itemElement.innerHTML =
                    `${item.name} - ₹${item.price}
                    <button onclick="removeFromCart(${index})">
                    Remove
                    </button>`;

                cartItems.appendChild(itemElement);
            });

            document.getElementById("total").textContent = total;
        }

        displayCart();
    </script>
</body>
</html>
