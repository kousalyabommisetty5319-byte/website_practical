<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Image Slideshow</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        img {
            width: 400px;
            height: 250px;
            object-fit: cover;
        }

        button {
            padding: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<a href="../index/index.html">🏠 Home</a>
<a href="index.html">⬅️ Back to JavaScript Programs</a>
<h2>Image Slideshow</h2>

<img id="slide" alt="Slideshow Image">

<br>

<button id="nextButton">Next Image</button>

<script>
const images = [
    "https://picsum.photos/id/1015/400/250",
    "https://picsum.photos/id/1025/400/250",
    "https://picsum.photos/id/1035/400/250"
];

let index = 0;

const slide = document.getElementById("slide");
const nextButton = document.getElementById("nextButton");

function showImage() {
    slide.src = images[index];
}

nextButton.addEventListener("click", function() {
    index = (index + 1) % images.length;
    showImage();
});

showImage();

setInterval(function() {
    index = (index + 1) % images.length;
    showImage();
}, 3000);
</script>

</body>
</html>
