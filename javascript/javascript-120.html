<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #56ab2f, #a8e063);
            text-align: center;
            padding: 60px 20px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        input, button {
            padding: 12px;
            margin: 10px;
            border-radius: 8px;
            border: 1px solid #aaa;
        }

        button {
            background: #56ab2f;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #eeeeee;
        }

        a {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>BMI Calculator</h1>

        <input type="number" id="weight" placeholder="Weight in kg">
        <input type="number" id="height" placeholder="Height in meters">

        <br>

        <button onclick="calculateBMI()">Calculate BMI</button>

        <div id="result"></div>

        <a href="../index/index.html">🏠 Home</a>
        <a href="index.html">⬅️ Back to JavaScript Programs</a>
    </div>

    <script>
        function calculateBMI() {
            let weight = Number(document.getElementById("weight").value);
            let height = Number(document.getElementById("height").value);

            if (weight <= 0 || height <= 0) {
                document.getElementById("result").textContent =
                    "Enter valid weight and height.";
                return;
            }

            let bmi = weight / (height * height);
            let category;

            if (bmi < 18.5) {
                category = "Underweight";
            } else if (bmi < 25) {
                category = "Normal weight";
            } else if (bmi < 30) {
                category = "Overweight";
            } else {
                category = "Obesity";
            }

            document.getElementById("result").innerHTML = `
                <p>Your BMI: ${bmi.toFixed(2)}</p>
                <p>Category: ${category}</p>
            `;
        }
    </script>
</body>
</html>
