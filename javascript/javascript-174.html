<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Event Handlers</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f7fb;
            text-align: center;
            padding: 30px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            margin: auto;
        }

        button {
            padding: 12px;
            margin: 10px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #output {
            font-size: 20px;
            margin: 20px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Multiple Buttons with Different Events</h1>

        <p>
            <a href="../index/index.html">⬅ Back to Main Index</a>
            <a href="index.html">💻 JavaScript Programs</a
        </p>

        <button onclick="sayHello()">Say Hello</button>

        <button onclick="changeColor()">Change Background</button>

        <button onclick="showDate()">Show Date</button>

        <p id="output">Click a button to see the result.</p>
    </div>

    <script>
        function sayHello() {
            document.getElementById("output").innerHTML = "Hello, Kousalya!";
        }

        function changeColor() {
            document.body.style.backgroundColor = "lightblue";
        }

        function showDate() {
            document.getElementById("output").innerHTML =
                new Date().toLocaleString();
        }
    </script>

</body>
</html>
