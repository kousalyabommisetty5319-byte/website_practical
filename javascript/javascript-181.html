<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag and Drop</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f4f7fb;
            padding: 30px;
        }

        #item {
            width: 120px;
            padding: 20px;
            margin: 30px auto;
            background: #4f46e5;
            color: white;
            border-radius: 10px;
            cursor: grab;
        }

        #dropZone {
            width: 300px;
            height: 180px;
            border: 3px dashed #4f46e5;
            margin: 30px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
        }
    </style>
</head>

<body>

<h1>Drag and Drop Application</h1>

<div id="item" draggable="true">
    Drag Me
</div>

<div id="dropZone">
    Drop Here
</div>

<p id="output"></p>

<p>
    <a href="../index/index.html">⬅ Back to Main Index</a>
    <a href="index.html">💻 JavaScript Programs</a
</p>

<script>

    let item = document.getElementById("item");
    let dropZone = document.getElementById("dropZone");
    let output = document.getElementById("output");

    item.addEventListener("dragstart", function(event) {
        event.dataTransfer.setData("text", event.target.id);
        output.innerHTML = "Dragging started...";
    });

    dropZone.addEventListener("dragover", function(event) {
        event.preventDefault();
    });

    dropZone.addEventListener("drop", function(event) {

        event.preventDefault();

        let data = event.dataTransfer.getData("text");

        dropZone.appendChild(document.getElementById(data));

        output.innerHTML = "Item dropped successfully!";

    });

</script>

</body>
</html>
