<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Button Validation</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2ff;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        button {
            padding: 12px 25px;
            margin-top: 20px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #message {
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Radio Button Validation</h1>

    <p>Select your course:</p>

    <label>
        <input type="radio" name="course" value="CSE">
        CSE
    </label>

    <label>
        <input type="radio" name="course" value="ECE">
        ECE
    </label>

    <label>
        <input type="radio" name="course" value="EEE">
        EEE
    </label>

    <br>

    <button onclick="validateRadio()">Submit</button>

    <p id="message"></p>

    <a href="../index/index.html">⬅ Back to Main Index</a>
    <a href="index.html">💻 JavaScript Programs</a

</div>

<script>

    function validateRadio() {

        let selected = document.querySelector(
            'input[name="course"]:checked'
        );

        let message = document.getElementById("message");

        if (selected === null) {
            message.innerHTML = "Please select a course.";
            message.style.color = "red";
        }
        else {
            message.innerHTML =
                "Selected course: " + selected.value;
            message.style.color = "green";
        }

    }

</script>

</body>
</html>
