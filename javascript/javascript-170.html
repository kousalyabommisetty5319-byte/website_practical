<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Event</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #e0f7fa;
            padding: 40px;
        }

        form {
            background: white;
            padding: 25px;
            border-radius: 15px;
            display: inline-block;
        }

        input {
            padding: 12px;
            margin: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            cursor: pointer;
        }

        #result {
            color: #006064;
        }

        a {
            display: block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <a href="../index/index.html">🏠 Home</a>
    <a href="index.html">⬅ Back to JavaScript</a>

    <h1>Submit Event</h1>

    <form onsubmit="submitForm(event)">
        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >
        <br>

        <button type="submit">Submit</button>
    </form>

    <h2 id="result"></h2>

    <script>
        function submitForm(event) {
            event.preventDefault();

            const name = document.getElementById("name").value;

            document.getElementById("result").textContent =
                "Form submitted successfully. Hello, " + name + "!";
        }
    </script>

</body>
</html>
