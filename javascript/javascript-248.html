<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Username</title>

    <style>
        body {
            font-family: Arial;
            background-color: #e3f2fd;
            padding: 30px;
        }

        .box {
            max-width: 500px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
            text-align: center;
        }

        input, button {
            padding: 10px;
            margin: 8px;
        }

        button {
            background-color: #2196f3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>Store Username</h2>

        <input type="text" id="username" placeholder="Enter username">

        <br>

        <button onclick="storeUsername()">Save Username</button>

        <p id="message"></p>

        <a href="../index/index.html">⬅ Back to Main Index</a>
        <a href="index.html">💻 JavaScript Programs</a
    </div>

    <script>
        function storeUsername() {
            let username = document.getElementById("username").value;

            if (username === "") {
                document.getElementById("message").innerHTML =
                    "Please enter a username.";
            } else {
                localStorage.setItem("username", username);

                document.getElementById("message").innerHTML =
                    "Username saved successfully!";
            }
        }
    </script>
</body>
</html>
