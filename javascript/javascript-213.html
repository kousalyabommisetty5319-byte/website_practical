<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Strength Meter</title>

<style>
body {
    font-family: Arial;
    background: #f5f3ff;
    padding: 40px;
}

.box {
    background: white;
    max-width: 500px;
    margin: auto;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 0 15px #aaa;
}

h2 {
    text-align: center;
    color: #7c3aed;
}

input {
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
}

#strength {
    margin-top: 15px;
    font-weight: bold;
}

a {
    display: block;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="box">

<h2>Password Strength Meter</h2>

<input type="password" id="password" placeholder="Enter password">

<p id="strength">Enter a password</p>

<a href="../index/index.html">⬅ Back to Main Index</a>
<a href="index.html">💻 JavaScript Programs</a

</div>

<script>

document.getElementById("password").addEventListener("input", function() {

    let password = this.value;
    let strength = document.getElementById("strength");

    if (password.length === 0) {
        strength.innerHTML = "Enter a password";
        strength.style.color = "black";
    }
    else if (password.length < 6) {
        strength.innerHTML = "Weak Password";
        strength.style.color = "red";
    }
    else if (password.length < 10) {
        strength.innerHTML = "Medium Password";
        strength.style.color = "orange";
    }
    else {
        strength.innerHTML = "Strong Password";
        strength.style.color = "green";
    }

});

</script>

</body>
</html>
