<!DOCTYPE html>
<html>
<head>
    <title>JavaScript 67 - Email Validation</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #ede7f6;
            padding: 30px;
        }

        .box {
            background: white;
            padding: 25px;
            max-width: 600px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        input, button {
            padding: 10px;
            margin: 8px;
        }

        input {
            width: 250px;
        }

        button {
            background: #673ab7;
            color: white;
            border: none;
            border-radius: 5px;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Email Validation</h1>

    <input type="text" id="email" placeholder="Enter email">

    <button onclick="validateEmail()">Validate</button>

    <div id="result"></div>

    <div class="navigation">
        <a href="../index/index.html">🏠 Home</a> |
        <a href="index.html">💻 JavaScript Programs</a>
    </div>

</div>

<script>

function validateEmail() {

    let email = document.getElementById("email").value;

    let pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (pattern.test(email)) {

        document.getElementById("result").innerHTML =
            "✅ Valid Email Address";

    } else {

        document.getElementById("result").innerHTML =
            "❌ Invalid Email Address";
    }
}

</script>

</body>
</html>
