<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffecd2, #fcb69f);
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px gray;
        }

        h1 {
            color: #d84315;
        }

        input {
            width: 90%;
            padding: 14px;
            box-sizing: border-box;
            border: 2px solid #ff8a65;
            border-radius: 8px;
            font-size: 16px;
        }

        .strength {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            background: #eeeeee;
        }

        ul {
            text-align: left;
            line-height: 2;
        }

        a {
            display: inline-block;
            margin: 15px 5px;
            padding: 10px;
            background: #d84315;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🔑 Password Strength Checker</h1>

    <input type="password" id="password"
           placeholder="Enter your password">

    <div class="strength" id="strength">
        Password strength will appear here.
    </div>

    <h3>Password Requirements</h3>

    <ul>
        <li>At least 8 characters</li>
        <li>One uppercase letter</li>
        <li>One lowercase letter</li>
        <li>One number</li>
        <li>One special character</li>
    </ul>

    <a href="../index/index.html">🏠 Home</a>
    <a href="index.html">⬅️ Back to JavaScript Programs</a>
</div>

<script>
    const passwordInput = document.getElementById("password");
    const strengthOutput = document.getElementById("strength");

    passwordInput.addEventListener("input", function() {
        const password = passwordInput.value;
        let score = 0;

        if (password.length >= 8) {
            score++;
        }

        if (/[A-Z]/.test(password)) {
            score++;
        }

        if (/[a-z]/.test(password)) {
            score++;
        }

        if (/[0-9]/.test(password)) {
            score++;
        }

        if (/[^A-Za-z0-9]/.test(password)) {
            score++;
        }

        if (password.length === 0) {
            strengthOutput.textContent = "Enter a password.";
        } else if (score <= 2) {
            strengthOutput.textContent = "Weak Password";
        } else if (score <= 4) {
            strengthOutput.textContent = "Medium Password";
        } else {
            strengthOutput.textContent = "Strong Password";
        }
    });
</script>

</body>
</html>
