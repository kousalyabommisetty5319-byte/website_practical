<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Hide Content</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 40px;
            background: #f4f4f4;
        }

        .navigation {
            margin-bottom: 30px;
        }

        .navigation a {
            text-decoration: none;
            color: #dd2476;
            font-weight: bold;
            margin: 10px;
        }

        .box {
            background: white;
            max-width: 550px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px #ccc;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            background: #dd2476;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #content {
            margin: 20px;
            padding: 20px;
            background: #fce4ec;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="navigation">
        <a href="../index/index.html">🏠 Home</a> |
        <a href="index.html">💻 JavaScript Programs</a>
    </div>

    <div class="box">

        <h1>Show / Hide Content</h1>

        <div id="content">
            <p>
                This content can be shown or hidden using JavaScript.
            </p>
        </div>

        <button onclick="showContent()">Show</button>
        <button onclick="hideContent()">Hide</button>

    </div>

    <script>
        function showContent() {
            document.getElementById("content").style.display = "block";
        }

        function hideContent() {
            document.getElementById("content").style.display = "none";
        }
    </script>

</body>
</html>
