<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Delegation</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f7fb;
            text-align: center;
            padding: 30px;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        li {
            list-style: none;
            padding: 15px;
            margin: 10px;
            background: #e0e7ff;
            border-radius: 8px;
            cursor: pointer;
        }

        #output {
            font-size: 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Event Delegation</h1>

    <ul id="myList">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Python</li>
    </ul>

    <p id="output">Click an item.</p>

    <p>
        <a href="../index/index.html">⬅ Back to Main Index</a>
        <a href="index.html">💻 JavaScript Programs</a
    </p>

</div>

<script>

    document.getElementById("myList").addEventListener("click", function(event) {

        if (event.target.tagName === "LI") {

            document.getElementById("output").innerHTML =
                "You selected: " + event.target.innerHTML;

        }

    });

</script>

</body>
</html>
