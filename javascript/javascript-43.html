<!DOCTYPE html>
<html>
<head>
    <title>JavaScript 43 - Fetch API</title>

    <style>
        body {
            font-family: Arial;
            background-color: #e3f2fd;
            text-align: center;
            padding: 30px;
        }

        .box {
            background-color: white;
            padding: 30px;
            max-width: 700px;
            margin: auto;
            border-radius: 10px;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="navigation">
    <a href="../index/index.html">🏠 Home</a> |
    <a href="index.html">💻 JavaScript Programs</a>
</div>

<div class="box">

    <h1>Fetch API</h1>

    <button onclick="getData()">Fetch Data</button>

    <div id="result"></div>

</div>

<script>
function getData() {

    fetch("https://jsonplaceholder.typicode.com/posts/1")

    .then(response => response.json())

    .then(data => {

        document.getElementById("result").innerHTML =
            "<h3>" + data.title + "</h3>" +
            "<p>" + data.body + "</p>";

    })

    .catch(error => {

        document.getElementById("result").innerHTML =
            "Error fetching data.";

    });
}
</script>

</body>
</html>
