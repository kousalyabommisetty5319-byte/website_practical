<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Regex Validation</title>

<style>
body {
    font-family: Arial;
    background: #eef2ff;
    padding: 40px;
}

.box {
    background: white;
    max-width: 500px;
    margin: auto;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 0 15px #aaa;
}

h2 {
    text-align: center;
    color: #4f46e5;
}

input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 10px;
    background: #4f46e5;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

#result {
    margin-top: 15px;
    font-weight: bold;
}

a {
    display: block;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="box">

<h2>Password Regex Validation</h2>

<form id="form">

<label>Password:</label>
<input type="password" id="password">

<button type="submit">Validate Password</button>

</form>

<p id="result"></p>

<a href="../index/index.html">⬅ Back to Main Index</a>
<a href="index.html">💻 JavaScript Programs</a

</div>

<script>

document.getElementById("form").addEventListener("submit", function(event) {

    event.preventDefault();

    let password = document.getElementById("password").value;

    // Minimum 8 characters,
    // one uppercase,
    // one lowercase,
    // one number,
    // one special character
    let pattern = /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

    if (pattern.test(password)) {
        document.getElementById("result").innerHTML =
            "✓ Password is valid";
        document.getElementById("result").style.color = "green";
    } else {
        document.getElementById("result").innerHTML =
            "✗ Password must contain uppercase, lowercase, number, special character and 8+ characters";
        document.getElementById("result").style.color = "red";
    }

});

</script>

</body>
</html>
