<!DOCTYPE html>
<html>
<head>
    <title>JavaScript 53 - Multiplication Table</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f0f8ff;
            padding: 30px;
        }

        .box {
            background: white;
            padding: 25px;
            max-width: 500px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        input, button {
            padding: 10px;
            margin: 8px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }

        #result {
            margin-top: 20px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Multiplication Table</h1>

    <input type="number" id="num" placeholder="Enter a number">
    <button onclick="table()">Generate</button>

    <div id="result"></div>

    <div class="navigation">
        <a href="../index/index.html">🏠 Home</a> |
        <a href="index.html">💻 JavaScript Programs</a>
    </div>
</div>

<script>
function table() {
    let n = Number(document.getElementById("num").value);
    let output = "";

    for (let i = 1; i <= 10; i++) {
        output += n + " × " + i + " = " + (n * i) + "<br>";
    }

    document.getElementById("result").innerHTML = output;
}
</script>

</body>
</html>
