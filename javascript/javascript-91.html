<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #89f7fe, #66a6ff);
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px gray;
        }

        h1 {
            text-align: center;
            color: #1565c0;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 2px solid #90caf9;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }

        .error {
            color: red;
            font-size: 14px;
            display: block;
            margin-top: 5px;
        }

        .success {
            color: green;
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
        }

        a {
            display: inline-block;
            margin: 15px 5px;
            padding: 12px 18px;
            background: #1565c0;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🎓 Student Registration</h1>

        <form id="registrationForm" novalidate>

            <label for="name">Full Name:</label>
            <input type="text" id="name" placeholder="Enter your full name">
            <span class="error" id="nameError"></span>

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter your email">
            <span class="error" id="emailError"></span>

            <label for="phone">Phone Number:</label>
            <input type="text" id="phone" placeholder="Enter 10-digit phone number">
            <span class="error" id="phoneError"></span>

            <label for="age">Age:</label>
            <input type="number" id="age" placeholder="Enter your age">
            <span class="error" id="ageError"></span>

            <label for="course">Select Course:</label>
            <select id="course">
                <option value="">Choose a course</option>
                <option value="CSE">Computer Science</option>
                <option value="AI">Artificial Intelligence</option>
                <option value="DS">Data Science</option>
            </select>
            <span class="error" id="courseError"></span>

            <button type="submit">Register</button>
        </form>

        <p class="success" id="successMessage"></p>

        <a href="../index/index.html">🏠 Home</a>
        <a href="index.html">⬅️ Back to JavaScript Programs</a>
    </div>

    <script>
        const form = document.getElementById("registrationForm");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            // Clear previous messages
            document.querySelectorAll(".error").forEach(function(error) {
                error.textContent = "";
            });

            document.getElementById("successMessage").textContent = "";

            let isValid = true;

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const age = document.getElementById("age").value;
            const course = document.getElementById("course").value;

            // Name validation
            if (name === "") {
                document.getElementById("nameError").textContent =
                    "Please enter your name.";
                isValid = false;
            }

            // Email validation
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(email)) {
                document.getElementById("emailError").textContent =
                    "Please enter a valid email address.";
                isValid = false;
            }

            // Phone validation
            const phonePattern = /^[0-9]{10}$/;

            if (!phonePattern.test(phone)) {
                document.getElementById("phoneError").textContent =
                    "Phone number must contain exactly 10 digits.";
                isValid = false;
            }

            // Age validation
            if (age === "" || age < 17 || age > 60) {
                document.getElementById("ageError").textContent =
                    "Age must be between 17 and 60.";
                isValid = false;
            }

            // Course validation
            if (course === "") {
                document.getElementById("courseError").textContent =
                    "Please select a course.";
                isValid = false;
            }

            // Final result
            if (isValid) {
                document.getElementById("successMessage").textContent =
                    "Registration successful!";
                form.reset();
            }
        });
    </script>

</body>
</html>
