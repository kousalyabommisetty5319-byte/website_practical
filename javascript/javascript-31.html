<!DOCTYPE html>
<html>
<head>
    <title>JavaScript 31 - To-Do List</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f5f5f5;
            text-align: center;
            padding: 30px;
        }

        .box {
            background: white;
            padding: 25px;
            max-width: 500px;
            margin: auto;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            width: 60%;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }

        li {
            margin: 10px;
            list-style: none;
        }
    </style>
</head>

<body>

<div class="navigation">
    <a href="../index/index.html">🏠 Home</a> |
    <a href="index.html">💻 JavaScript Programs</a>
</div>

<div class="box">
    <h1>To-Do List</h1>

    <input type="text" id="task" placeholder="Enter a task">
    <button onclick="addTask()">Add</button>

    <ul id="taskList"></ul>
</div>

<script>
function addTask() {
    let task = document.getElementById("task").value;

    if (task == "") {
        alert("Please enter a task");
        return;
    }

    let li = document.createElement("li");
    li.innerHTML = task + " <button onclick='this.parentElement.remove()'>Delete</button>";

    document.getElementById("taskList").appendChild(li);

    document.getElementById("task").value = "";
}
</script>

</body>
</html>
