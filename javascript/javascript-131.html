<!DOCTYPE html>
<html>
<head>
    <title>Toggle CSS Class</title>

    <style>
        .active {
            color: white;
            background-color: green;
            padding: 20px;
        }
    </style>
</head>
<body>

<h2 id="heading">Toggle Class Example</h2>

<button onclick="toggleClass()">Toggle Style</button>
<a href="../index/index.html">🏠 Home</a>
        <a href="index.html">⬅️ Back to JavaScript Programs</a>
<script>
function toggleClass() {
    document.getElementById("heading").classList.toggle("active");
}
</script>

</body>
</html>
