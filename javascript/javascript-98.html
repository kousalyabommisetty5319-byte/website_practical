<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Window Object</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            color: #222;
            padding: 25px;
            border-radius: 15px;
        }

        button, a {
            padding: 12px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            padding: 15px;
            background: #f1f1f1;
            border-radius: 10px;
            text-align: left;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Window Object Demonstration</h1>

        <button onclick="showSize()">Window Size</button>
        <button onclick="showAlert()">Alert</button>
        <button onclick="showConfirm()">Confirm</button>
        <button onclick="showPrompt()">Prompt</button>
        <button onclick="startTimer()">Start Timer</button>

        <div id="output">Click a button to see the result.</div>

        <br>

        <a href="../index/index.html">🏠 Home</a>
        <a href="index.html">⬅️ Back to JavaScript Programs</a>
    </div>

    <script>
        function showSize() {
            document.getElementById("output").innerHTML =
                "Window Width: " + window.innerWidth +
                "<br>Window Height: " + window.innerHeight;
        }

        function showAlert() {
            window.alert("Welcome to the Window Object demonstration!");
        }

        function showConfirm() {
            let result = window.confirm("Do you like JavaScript?");

            document.getElementById("output").innerHTML =
                result ? "You selected OK." : "You selected Cancel.";
        }

        function showPrompt() {
            let name = window.prompt("Enter your name:");

            if (name !== null && name !== "") {
                document.getElementById("output").innerHTML =
                    "Hello, " + name + "!";
            } else {
                document.getElementById("output").innerHTML =
                    "No name entered.";
            }
        }

        function startTimer() {
            document.getElementById("output").innerHTML =
                "Timer started. Wait for 3 seconds...";

            window.setTimeout(function () {
                document.getElementById("output").innerHTML =
                    "3 seconds completed!";
            }, 3000);
        }
    </script>
</body>
</html>
