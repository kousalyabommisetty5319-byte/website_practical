<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persistent Shopping Cart</title>

    <style>
        body {
            font-family: Arial;
            background-color: #fbe9e7;
            padding: 30px;
        }

        .box {
            max-width: 650px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        .product {
            background-color: #f5f5f5;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }

        button {
            padding: 8px 12px;
            margin: 5px;
            background-color: #d84315;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #cart {
            margin-top: 20px;
        }

        a {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Persistent Shopping Cart</h2>

    <p>
        Add products and refresh the page. The cart will remain because
        it is stored in localStorage.
    </p>

    <div class="product">
        <b>Laptop</b>
        <p>₹50,000</p>
        <button onclick="addProduct('Laptop', 50000)">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <b>Mouse</b>
        <p>₹800</p>
        <button onclick="addProduct('Mouse', 800)">
            Add to Cart
        </button>
    </div>

    <div class="product">
        <b>Keyboard</b>
        <p>₹1,500</p>
        <button onclick="addProduct('Keyboard', 1500)">
            Add to Cart
        </button>
    </div>

    <h3>Your Cart</h3>

    <div id="cart"></div>

    <button onclick="clearCart()">Clear Cart</button>

    <a href="../index/index.html">⬅ Back to Main Index</a>
    <a href="index.html">💻 JavaScript Programs</a

</div>

<script>

function addProduct(name, price) {

    let cart = JSON.parse(localStorage.getItem("persistentCart")) || [];

    cart.push({
        name: name,
        price: price
    });

    localStorage.setItem(
        "persistentCart",
        JSON.stringify(cart)
    );

    displayCart();
}

function displayCart() {

    let cart =
        JSON.parse(localStorage.getItem("persistentCart")) || [];

    let output = document.getElementById("cart");

    if (cart.length === 0) {
        output.innerHTML = "Cart is empty.";
        return;
    }

    output.innerHTML = "";

    let total = 0;

    cart.forEach(function(product, index) {

        total += product.price;

        output.innerHTML += `
            <p>
                ${index + 1}. ${product.name} - ₹${product.price}
                <button onclick="removeProduct(${index})">
                    Remove
                </button>
            </p>
        `;

    });

    output.innerHTML += "<h3>Total: ₹" + total + "</h3>";
}

function removeProduct(index) {

    let cart =
        JSON.parse(localStorage.getItem("persistentCart")) || [];

    cart.splice(index, 1);

    localStorage.setItem(
        "persistentCart",
        JSON.stringify(cart)
    );

    displayCart();
}

function clearCart() {

    localStorage.removeItem("persistentCart");

    displayCart();
}

displayCart();

</script>

</body>
</html>
