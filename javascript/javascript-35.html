<!DOCTYPE html>
<html>
<head>
    <title>JavaScript 35 - Stopwatch</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #e8f5e9;
            padding: 40px;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 450px;
            margin: auto;
            border-radius: 10px;
        }

        #time {
            font-size: 45px;
            margin: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="navigation">
    <a href="../index/index.html">🏠 Home</a> |
    <a href="index.html">💻 JavaScript Programs</a>
</div>

<div class="box">

    <h1>Stopwatch</h1>

    <div id="time">00:00:00</div>

    <button onclick="start()">Start</button>
    <button onclick="stop()">Stop</button>
    <button onclick="reset()">Reset</button>

</div>

<script>
let seconds = 0;
let timer = null;

function displayTime() {

    let hours = Math.floor(seconds / 3600);
    let minutes = Math.floor((seconds % 3600) / 60);
    let secs = seconds % 60;

    hours = String(hours).padStart(2, "0");
    minutes = String(minutes).padStart(2, "0");
    secs = String(secs).padStart(2, "0");

    document.getElementById("time").innerHTML =
        hours + ":" + minutes + ":" + secs;
}

function start() {

    if (timer !== null) {
        return;
    }

    timer = setInterval(function() {
        seconds++;
        displayTime();
    }, 1000);
}

function stop() {
    clearInterval(timer);
    timer = null;
}

function reset() {
    stop();
    seconds = 0;
    displayTime();
}
</script>

</body>
</html>
