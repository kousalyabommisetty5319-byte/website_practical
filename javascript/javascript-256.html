<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Record System</title>

    <style>
        body {
            font-family: Arial;
            background-color: #e8eaf6;
            padding: 30px;
        }

        .box {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        button {
            background-color: #3f51b5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .student {
            background-color: #f5f5f5;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
        }

        a {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Student Record System</h2>

    <input type="text" id="name" placeholder="Student Name">
    <input type="number" id="age" placeholder="Age">
    <input type="text" id="course" placeholder="Course">

    <br>

    <button onclick="addStudent()">Add Student</button>
    <button onclick="displayStudents()">Display Students</button>

    <div id="result"></div>

    <a href="../index/index.html">⬅ Back to Main Index</a>
    <a href="index.html">💻 JavaScript Programs</a

</div>

<script>

function addStudent() {

    let name = document.getElementById("name").value;
    let age = document.getElementById("age").value;
    let course = document.getElementById("course").value;

    if (name === "" || age === "" || course === "") {
        alert("Please fill all fields.");
        return;
    }

    let students = JSON.parse(localStorage.getItem("students")) || [];

    let student = {
        name: name,
        age: age,
        course: course
    };

    students.push(student);

    localStorage.setItem("students", JSON.stringify(students));

    document.getElementById("name").value = "";
    document.getElementById("age").value = "";
    document.getElementById("course").value = "";

    alert("Student added successfully!");
}

function displayStudents() {

    let students = JSON.parse(localStorage.getItem("students")) || [];

    let result = document.getElementById("result");

    if (students.length === 0) {
        result.innerHTML = "<p>No student records found.</p>";
        return;
    }

    result.innerHTML = "<h3>Student Records</h3>";

    students.forEach(function(student, index) {

        result.innerHTML += `
            <div class="student">
                <b>Student ${index + 1}</b><br>
                Name: ${student.name}<br>
                Age: ${student.age}<br>
                Course: ${student.course}
            </div>
        `;

    });
}

</script>

</body>
</html>
