<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geographical Coordinates</title>
<style>
body {
    font-family: Arial;
    background: #f0fdf4;
    padding: 40px;
    text-align: center;
}
.box {
    background: white;
    max-width: 550px;
    margin: auto;
    padding: 25px;
    border-radius: 15px;
}
button {
    padding: 10px;
    background: #16a34a;
    color: white;
    border: none;
    border-radius: 5px;
}
</style>
</head>
<body>

<div class="box">
<h2>Geographical Coordinates</h2>

<button onclick="getCoordinates()">Get Coordinates</button>

<p id="result"></p>

<a href="../index/index.html">⬅ Back to Main Index</a>
<a href="index.html">💻 JavaScript Programs</a
</div>

<script>
function getCoordinates() {
    let result = document.getElementById("result");

    if (!navigator.geolocation) {
        result.innerHTML = "Geolocation is not supported.";
        return;
    }

    navigator.geolocation.getCurrentPosition(
        function(position) {
            let latitude = position.coords.latitude;
            let longitude = position.coords.longitude;

            result.innerHTML =
                "Latitude: " + latitude + "<br>" +
                "Longitude: " + longitude;
        },
        function(error) {
            result.innerHTML =
                "Location permission denied or unavailable.";
        }
    );
}
</script>

</body>
</html>
