<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>setTimeout Demonstration</title>
<style>
body {
    font-family: Arial;
    background: #f0fdf4;
    padding: 30px;
}
.box {
    background: white;
    max-width: 500px;
    margin: auto;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
}
button {
    padding: 12px;
    background: #16a34a;
    color: white;
    border: none;
    border-radius: 5px;
}
</style>
</head>
<body>

<div class="box">
<h2>setTimeout() Demonstration</h2>

<button onclick="startTimer()">Show Message After 3 Seconds</button>

<p id="result"></p>

<a href="../index/index.html">⬅ Back to Main Index</a>
<a href="index.html">💻 JavaScript Programs</a
</div>

<script>
function startTimer() {
    document.getElementById("result").innerHTML =
        "Please wait for 3 seconds...";

    setTimeout(function() {
        document.getElementById("result").innerHTML =
            "Hello! 3 seconds have passed.";
    }, 3000);
}
</script>

</body>
</html>
