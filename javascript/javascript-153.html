<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Word Counter</title>
    <style>
        body {
            font-family: Arial;
            background: #e3f2fd;
            text-align: center;
            padding: 40px;
        }

        textarea {
            width: 80%;
            height: 180px;
            padding: 15px;
            font-size: 18px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            display: inline-block;
        }

        a {
            display: block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <a href="../index/index.html">🏠 Home</a>
    <a href="index.html">💻 JavaScript Programs</a

    <div class="box">
        <h1>Live Word Counter</h1>

        <textarea id="textInput" placeholder="Start typing here..."></textarea>

        <h2>Words: <span id="wordCount">0</span></h2>
        <h2>Characters: <span id="charCount">0</span></h2>
    </div>

    <script>
        const textInput = document.getElementById("textInput");
        const wordCount = document.getElementById("wordCount");
        const charCount = document.getElementById("charCount");

        textInput.addEventListener("input", function () {
            const text = textInput.value.trim();

            const words = text === "" ? 0 : text.split(/\s+/).length;

            wordCount.textContent = words;
            charCount.textContent = textInput.value.length;
        });
    </script>

</body>
</html>
