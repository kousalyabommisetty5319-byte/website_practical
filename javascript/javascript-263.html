<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recently Viewed Items</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f3e5f5;
            padding: 30px;
        }

        .box {
            max-width: 650px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        .item {
            background-color: #f5f5f5;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }

        button {
            padding: 10px;
            background-color: #7b1fa2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Recently Viewed Items</h2>

    <div class="item">
        <h3>Laptop</h3>
        <button onclick="viewItem('Laptop')">View Item</button>
    </div>

    <div class="item">
        <h3>Mobile Phone</h3>
        <button onclick="viewItem('Mobile Phone')">View Item</button>
    </div>

    <div class="item">
        <h3>Headphones</h3>
        <button onclick="viewItem('Headphones')">View Item</button>
    </div>

    <div class="item">
        <h3>Keyboard</h3>
        <button onclick="viewItem('Keyboard')">View Item</button>
    </div>

    <h3>Recently Viewed</h3>

    <div id="recent"></div>

    <button onclick="clearRecent()">Clear Recently Viewed</button>

    <a href="../index/index.html">⬅ Back to Main Index</a>
    <a href="index.html">💻 JavaScript Programs</a

</div>

<script>

function viewItem(item) {

    let recent = JSON.parse(localStorage.getItem("recentItems")) || [];

    // Remove duplicate item
    recent = recent.filter(function(existingItem) {
        return existingItem !== item;
    });

    // Add item at the beginning
    recent.unshift(item);

    // Keep only the latest 5 items
    recent = recent.slice(0, 5);

    localStorage.setItem("recentItems", JSON.stringify(recent));

    displayRecent();
}

function displayRecent() {

    let recent = JSON.parse(localStorage.getItem("recentItems")) || [];

    let output = document.getElementById("recent");

    if (recent.length === 0) {
        output.innerHTML = "No recently viewed items.";
        return;
    }

    output.innerHTML = "";

    recent.forEach(function(item, index) {

        output.innerHTML +=
            "<p>" + (index + 1) + ". " + item + "</p>";

    });
}

function clearRecent() {

    localStorage.removeItem("recentItems");

    displayRecent();
}

displayRecent();

</script>

</body>
</html>
