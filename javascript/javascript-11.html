<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of Digits</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 40px;
        }

        .navigation {
            margin-bottom: 30px;
        }

        .navigation a {
            text-decoration: none;
            color: #dd2476;
            font-weight: bold;
            margin: 10px;
        }

        .box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px #ccc;
        }

        input {
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            background: #dd2476;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #dd2476;
        }
    </style>
</head>

<body>

    <div class="navigation">
        <a href="../index/index.html">🏠 Home</a> |
        <a href="index.html">💻 JavaScript Programs</a>
    </div>

    <div class="box">
        <h1>Sum of Digits</h1>

        <input type="number" id="number" placeholder="Enter number">

        <br>

        <button onclick="sumDigits()">Calculate</button>

        <div id="result"></div>
    </div>

    <script>
        function sumDigits() {
            let number = Number(
                document.getElementById("number").value
            );

            let sum = 0;
            let temp = Math.abs(number);

            while (temp > 0) {
                sum = sum + (temp % 10);
                temp = Math.floor(temp / 10);
            }

            document.getElementById("result").textContent =
                "Sum of digits = " + sum;
        }
    </script>

</body>
</html>
