<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Form Validation</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
            padding: 40px;
        }

        .navigation {
            margin-bottom: 30px;
        }

        .navigation a {
            text-decoration: none;
            color: #dd2476;
            font-weight: bold;
            margin: 10px;
        }

        .box {
            background: white;
            max-width: 550px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px #ccc;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px;
        }

        button {
            padding: 10px 25px;
            background: #dd2476;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <div class="navigation">
        <a href="../index/index.html">🏠 Home</a> |
        <a href="index.html">💻 JavaScript Programs</a>
    </div>

    <div class="box">

        <h1>Complete Form Validation</h1>

        <form onsubmit="return validateForm()">

            <input type="text" id="name"
                   placeholder="Name">

            <input type="email" id="email"
                   placeholder="Email">

            <input type="text" id="phone"
                   placeholder="10-digit phone number">

            <input type="password" id="password"
                   placeholder="Password">

            <br>

            <button type="submit">Validate</button>

        </form>

        <div id="result"></div>

    </div>

    <script>
        function validateForm() {

            let name =
                document.getElementById("name").value.trim();

            let email =
                document.getElementById("email").value.trim();

            let phone =
                document.getElementById("phone").value.trim();

            let password =
                document.getElementById("password").value;

            let namePattern = /^[A-Za-z ]+$/;

            let emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            let phonePattern =
                /^[0-9]{10}$/;

            let messages = [];

            if (!namePattern.test(name)) {
                messages.push("Enter a valid name.");
            }

            if (!emailPattern.test(email)) {
                messages.push("Enter a valid email.");
            }

            if (!phonePattern.test(phone)) {
                messages.push("Phone number must contain 10 digits.");
            }

            if (password.length < 8) {
                messages.push(
                    "Password must contain at least 8 characters."
                );
            }

            if (messages.length > 0) {

                document.getElementById("result").innerHTML =
                    messages.join("<br>");

            } else {

                document.getElementById("result").textContent =
                    "✅ All details are valid!";
            }

            return false;
        }
    </script>

</body>
</html>
