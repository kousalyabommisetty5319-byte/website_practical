<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>addEventListener()</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f7fb;
            text-align: center;
            padding: 30px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            margin: auto;
        }

        button {
            padding: 12px 20px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            font-size: 20px;
            margin: 20px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Demonstration of addEventListener()</h1>

        <p>
            <a href="../index/index.html">⬅ Back to Main Index</a>
            <a href="index.html">💻 JavaScript Programs</a
        </p>

        <button id="myButton">Click Me</button>

        <p id="result"></p>
    </div>

    <script>
        document.getElementById("myButton").addEventListener("click", function() {
            document.getElementById("result").innerHTML =
                "The button was clicked using addEventListener()!";
        });
    </script>

</body>
</html>
