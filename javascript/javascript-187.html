<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Typing Test</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f7fb;
            text-align: center;
            padding: 30px;
        }

        .box {
            background: white;
            max-width: 700px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
        }

        #sentence {
            background: #e0e7ff;
            padding: 20px;
            border-radius: 10px;
            font-size: 20px;
        }

        textarea {
            width: 90%;
            height: 120px;
            margin-top: 20px;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #4f46e5;
            border-radius: 10px;
        }

        #result {
            font-size: 20px;
            margin-top: 20px;
        }

        button {
            padding: 12px 25px;
            margin-top: 20px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Keyboard Typing Test</h1>

    <p>Type the sentence shown below:</p>

    <div id="sentence">
        JavaScript makes webpages interactive.
    </div>

    <textarea id="typingArea"
        placeholder="Start typing here..."></textarea>

    <p id="result">Start typing to begin the test.</p>

    <button onclick="resetTest()">Reset Test</button>

    <p>
        <a href="../index/index.html">⬅ Back to Main Index</a>
        <a href="index.html">💻 JavaScript Programs</a
    </p>

</div>

<script>

    let sentence =
        "JavaScript makes webpages interactive.";

    let startTime = null;

    let typingArea = document.getElementById("typingArea");
    let result = document.getElementById("result");

    typingArea.addEventListener("input", function() {

        if (startTime === null) {
            startTime = new Date().getTime();
        }

        let typedText = typingArea.value;

        if (typedText === sentence) {

            let endTime = new Date().getTime();

            let timeTaken = (endTime - startTime) / 1000;

            let words = sentence.split(" ").length;

            let wpm = Math.round((words / timeTaken) * 60);

            result.innerHTML =
                "Test completed!<br>" +
                "Time: " + timeTaken.toFixed(2) + " seconds<br>" +
                "Speed: " + wpm + " WPM";

        } else {

            result.innerHTML =
                "Characters typed: " + typedText.length +
                " / " + sentence.length;

        }

    });

    function resetTest() {

        typingArea.value = "";

        result.innerHTML =
            "Start typing to begin the test.";

        startTime = null;

    }

</script>

</body>
</html>
