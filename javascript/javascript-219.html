<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Form</title>

<style>
body {
    font-family: Arial;
    background: #ecfeff;
    padding: 40px;
}

.box {
    background: white;
    max-width: 500px;
    margin: auto;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 0 15px #aaa;
}

h2 {
    text-align: center;
    color: #0891b2;
}

input, textarea {
    width: 100%;
    padding: 10px;
    margin: 8px 0 15px;
    box-sizing: border-box;
}

textarea {
    height: 120px;
}

button {
    width: 100%;
    padding: 12px;
    background: #0891b2;
    color: white;
    border: none;
    border-radius: 6px;
}

#result {
    font-weight: bold;
}

a {
    display: block;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="box">

<h2>Contact Form</h2>

<form id="form">

<label>Name:</label>
<input type="text" id="name">

<label>Email:</label>
<input type="email" id="email">

<label>Message:</label>
<textarea id="message"></textarea>

<button type="submit">Send Message</button>

</form>

<p id="result"></p>

<a href="../index/index.html">⬅ Back to Main Index</a>
<a href="index.html">💻 JavaScript Programs</a

</div>

<script>

document.getElementById("form").addEventListener("submit", function(event) {

    event.preventDefault();

    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let message = document.getElementById("message").value.trim();

    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    let result = document.getElementById("result");

    if (name === "") {
        result.innerHTML = "Please enter your name.";
        result.style.color = "red";
    }
    else if (!emailPattern.test(email)) {
        result.innerHTML = "Please enter a valid email.";
        result.style.color = "red";
    }
    else if (message === "") {
        result.innerHTML = "Please enter your message.";
        result.style.color = "red";
    }
    else {
        result.innerHTML = "✓ Message sent successfully!";
        result.style.color = "green";
    }

});

</script>

</body>
</html>
