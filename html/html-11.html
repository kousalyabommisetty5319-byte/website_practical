<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Internal and External CSS</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f1f5f9;
            padding: 30px;
        }

        .internal {
            color: blue;
            background-color: lightblue;
            padding: 20px;
        }
    </style>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>

<body>

    <h1>CSS Styling Demonstration</h1>

    <p style="color:red; font-size:20px;">
        This paragraph uses Inline CSS.
    </p>

    <p class="internal">
        This paragraph uses Internal CSS.
    </p>

    <p class="text-success fs-4">
        This paragraph uses an External CSS library.
    </p>

    <a href="../index/index.html">Home</a> |
    <a href="index.html">HTML Programs</a>

</body>
</html>
