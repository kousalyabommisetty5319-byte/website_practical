<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Responsive Webpage</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            background-color: #2563eb;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 30px;
        }

        .box {
            flex: 1;
            padding: 30px;
            background-color: #dbeafe;
            text-align: center;
        }

        @media (max-width: 600px) {

            .container {
                flex-direction: column;
            }

            header h1 {
                font-size: 25px;
            }

        }

    </style>

</head>

<body>

    <header>
        <h1>Responsive Webpage</h1>
        <p>Resize the browser window.</p>
    </header>

    <div class="container">

        <div class="box">
            <h2>HTML</h2>
            <p>Structure of webpages.</p>
        </div>

        <div class="box">
            <h2>CSS</h2>
            <p>Styling of webpages.</p>
        </div>

        <div class="box">
            <h2>JavaScript</h2>
            <p>Webpage functionality.</p>
        </div>

    </div>

    <center>
        <a href="../index/index.html">Home</a> |
        <a href="index.html">HTML Programs</a>
    </center>

</body>
</html>
