<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>CSS Selectors</title>

    <style>

        body {
            font-family: Arial;
            margin: 30px;
            background-color: #f8fafc;
        }

        h1 {
            color: blue;
        }

        .box {
            background-color: lightblue;
            padding: 20px;
            margin: 20px;
            border: 3px solid blue;
        }

        #special {
            color: red;
            font-size: 22px;
        }

        p {
            line-height: 1.6;
        }

    </style>

</head>

<body>

    <h1>CSS Selectors and Styling</h1>

    <div class="box">

        <h2>Class Selector</h2>

        <p>
            This box demonstrates background,
            padding, margin and border.
        </p>

    </div>

    <p id="special">
        This paragraph uses an ID selector.
    </p>

    <p>
        This is an example of an element selector.
    </p>

    <a href="../index/index.html">Home</a> |
    <a href="index.html">HTML Programs</a>

</body>
</html>
