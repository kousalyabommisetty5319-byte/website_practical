<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio and Video</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #fff7ed;
            padding: 30px;
        }

        .box {
            background: white;
            padding: 25px;
            margin: 20px auto;
            max-width: 700px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #0002;
        }

        video {
            width: 100%;
            max-width: 600px;
        }
    </style>
</head>

<body>

    <h1>HTML Audio and Video</h1>

    <div class="box">

        <h2>Audio</h2>

        <audio controls>
            <source src="https://www.w3schools.com/html/horse.mp3"
                    type="audio/mpeg">
            Your browser does not support audio.
        </audio>

    </div>

    <div class="box">

        <h2>Video</h2>

        <video controls>
            <source src="https://www.w3schools.com/html/mov_bbb.mp4"
                    type="video/mp4">
            Your browser does not support video.
        </video>

    </div>

    <a href="../index/index.html">Home</a> |
    <a href="index.html">HTML Programs</a>

</body>
</html>
