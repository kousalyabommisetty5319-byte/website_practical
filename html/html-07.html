<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Iframe</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f5f3ff;
            padding: 30px;
        }

        iframe {
            width: 80%;
            height: 400px;
            border: 3px solid #333;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>HTML Iframe Example</h1>

    <p>An iframe displays another webpage inside the current webpage.</p>

    <iframe
        src="https://www.wikipedia.org"
        title="Wikipedia">
    </iframe>

    <br><br>

    <a href="../index/index.html">Home</a> |
    <a href="index.html">HTML Programs</a>

</body>
</html>
