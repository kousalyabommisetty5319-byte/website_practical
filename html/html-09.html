<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML5 Input Types</title>

    <style>
        body {
            font-family: Arial;
            background-color: #ecfdf5;
            padding: 30px;
        }

        form {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px;
        }

        input[type="submit"] {
            background-color: #16a34a;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <h1 style="text-align:center;">HTML5 Input Types</h1>

    <form>

        <label>Name:</label>
        <input type="text" placeholder="Enter name">

        <label>Email:</label>
        <input type="email" placeholder="Enter email">

        <label>Password:</label>
        <input type="password" placeholder="Enter password">

        <label>Date:</label>
        <input type="date">

        <label>Age:</label>
        <input type="number" min="1" max="100">

        <label>Color:</label>
        <input type="color">

        <label>Range:</label>
        <input type="range">

        <input type="submit" value="Submit">

    </form>

    <center>
        <a href="../index/index.html">Home</a> |
        <a href="index.html">HTML Programs</a>
    </center>

</body>
</html>
