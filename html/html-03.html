<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>HTML Tables</title>

    <style>
        table {
            border-collapse: collapse;
            width: 70%;
        }

        th,
        td {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h1>Student Marks Table</h1>

    <table>

        <tr>
            <th colspan="3">Student Information</th>
        </tr>

        <tr>
            <th>Name</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td rowspan="2">Kousalya</td>
            <td>HTML</td>
            <td>90</td>
        </tr>

        <tr>
            <td>CSS</td>
            <td>85</td>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>HTML</td>
            <td>88</td>
        </tr>

    </table>

    <br>

    <a href="../index/index.html">Home</a> |
    <a href="index.html">HTML Programs</a>

</body>

</html>
